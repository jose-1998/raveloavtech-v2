<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Page Not Found — Ravelo AV Tech</title>
  <link rel="icon" type="image/png" href="/uploads/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;600&family=DM+Serif+Display&display=swap" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #071e28;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      font-family: 'Figtree', sans-serif;
    }
    .logo img { height: 44px; width: auto; margin-bottom: 48px; }
    .code {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(6rem, 18vw, 11rem);
      line-height: 1;
      color: #0c2d3a;
      -webkit-text-stroke: 2px rgba(130,160,204,0.45);
      margin-bottom: 8px;
    }
    h1 {
      font-family: 'DM Serif Display', serif;
      font-weight: 400;
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      color: #fff;
      margin-bottom: 14px;
    }
    p {
      color: rgba(255,255,255,0.5);
      font-weight: 300;
      font-size: 1rem;
      line-height: 1.7;
      max-width: 420px;
      margin-bottom: 36px;
    }
    .actions { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
    .btn {
      display: inline-block;
      padding: 14px 32px;
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 4px;
      transition: all 0.25s;
    }
    .btn-primary { background: #82A0CC; color: #071e28; font-weight: 600; }
    .btn-primary:hover { background: #9ab5dd; }
    .btn-ghost { color: rgba(255,255,255,0.7); border: 1px solid rgba(130,160,204,0.3); }
    .btn-ghost:hover { color: #fff; border-color: rgba(130,160,204,0.6); }
    .phone {
      margin-top: 48px;
      color: rgba(255,255,255,0.35);
      font-size: 13px;
    }
    .phone a { color: #82A0CC; text-decoration: none; }
  </style>
</head>
<body>
  <a class="logo" href="/"><img src="/uploads/logo.png" alt="Ravelo AV Tech" /></a>
  <div class="code">404</div>
  <h1>This page doesn't exist</h1>
  <p>The page you're looking for was moved, deleted, or never existed. Let's get you back on track.</p>
  <div class="actions">
    <a class="btn btn-primary" href="/">Back to home</a>
    <a class="btn btn-ghost" href="/about.html">Contact us</a>
  </div>
  <p class="phone">Need help? Call or text <a href="tel:+16159620401">(615) 962-0401</a></p>
</body>
</html>
