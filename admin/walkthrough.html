<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <link rel="manifest" href="/admin/manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ravelo Admin" />
  <link rel="apple-touch-icon" href="/admin/icon.png" />
  <title>Site Walkthrough — Ravelo AV Tech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="/uploads/favicon.png" />
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:      #0c2d3a;
      --navy-dark: #0d1b2a;
      --navy-mid:  #0a2030;
      --blue:      #82A0CC;
      --blue-btn:  #5b8dee;
      --green:     #34c759;
      --red:       #e07070;
      --amber:     #f59e0b;
      --text:      rgba(255,255,255,0.88);
      --text-dim:  rgba(255,255,255,0.45);
      --border:    rgba(130,160,204,0.13);
      --card:      #0c2d3a;
      --check-bg:  rgba(130,160,204,0.08);
      --check-done-bg: rgba(52,199,89,0.08);
      --check-done-border: rgba(52,199,89,0.25);
    }

    html, body {
      min-height: 100%;
      background: var(--navy-dark);
      font-family: 'Figtree', -apple-system, sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Topbar ── */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 900;
      height: 58px;
      background: var(--navy);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 16px; gap: 12px;
    }
    .topbar-logo img { height: 34px; width: auto; display: block; }
    .topbar-divider  { width: 1px; height: 20px; background: rgba(130,160,204,0.2); flex-shrink: 0; }
    .topbar-label    { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--blue); flex: 1; }
    .topbar-logout {
      background: none; border: 1px solid rgba(224,112,112,0.35); color: var(--red);
      font-size: 11px; font-family: inherit; padding: 5px 10px;
      border-radius: 5px; cursor: pointer; white-space: nowrap;
    }
    .topbar-logout:hover { background: rgba(224,112,112,0.1); }

    /* ── Login ── */
    #loginScreen {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px;
    }
    .login-card {
      background: var(--navy); border: 1px solid var(--border);
      border-radius: 14px; padding: 36px 28px;
      width: 100%; max-width: 340px; text-align: center;
    }
    .login-card img { height: 40px; width: auto; margin-bottom: 24px; }
    .login-card h1  { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
    .login-card p   { font-size: 13px; color: var(--text-dim); margin-bottom: 28px; }
    .login-btn {
      width: 100%; padding: 13px; background: var(--blue-btn); color: #fff;
      border: none; border-radius: 8px; font-size: 14px; font-weight: 600;
      font-family: inherit; cursor: pointer;
    }

    /* ── Tab bar ── */
    .tab-bar {
      display: flex; gap: 3px; margin-bottom: 18px;
      background: rgba(130,160,204,0.07); border-radius: 10px;
      padding: 4px; border: 1px solid rgba(130,160,204,0.1);
    }
    .tab-btn {
      flex: 1; padding: 9px 8px; border: none; border-radius: 7px;
      background: none; color: var(--text-dim); font-family: inherit;
      font-size: 13px; font-weight: 600; cursor: pointer; text-align: center;
      text-decoration: none; transition: background 0.15s, color 0.15s, box-shadow 0.15s;
    }
    .tab-btn.active {
      background: var(--navy); color: var(--text);
      box-shadow: 0 1px 4px rgba(0,0,0,0.3), inset 0 0 0 1px rgba(130,160,204,0.12);
    }
    .tab-btn:not(.active):hover { background: rgba(130,160,204,0.07); color: rgba(255,255,255,0.65); }

    /* ── Main ── */
    #mainScreen { display: none; padding: 70px 0 80px; }

    /* ── Job info header ── */
    .job-header {
      padding: 16px 16px 0;
      max-width: 640px; margin: 0 auto;
    }
    .job-fields { display: flex; gap: 10px; margin-bottom: 14px; }
    .job-input {
      flex: 1; padding: 11px 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text); font-family: inherit; font-size: 14px;
      outline: none; transition: border-color 0.15s, background 0.15s;
      -webkit-appearance: none;
    }
    .job-input::placeholder { color: var(--text-dim); }
    .job-input:focus { border-color: rgba(130,160,204,0.45); background: rgba(255,255,255,0.08); }
    .clear-btn {
      padding: 11px 14px; background: rgba(224,112,112,0.1);
      border: 1px solid rgba(224,112,112,0.25);
      color: var(--red); border-radius: 8px;
      font-size: 13px; font-weight: 600; font-family: inherit;
      cursor: pointer; white-space: nowrap;
      transition: background 0.15s;
    }
    .clear-btn:hover { background: rgba(224,112,112,0.18); }

    /* ── Job type tabs ── */
    .type-tabs {
      display: flex; gap: 8px;
      padding: 0 16px;
      max-width: 640px; margin: 0 auto 18px;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .type-tabs::-webkit-scrollbar { display: none; }
    .type-tab {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 7px;
      padding: 9px 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-dim); font-size: 13px; font-weight: 600;
      font-family: inherit; cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .type-tab:hover { background: rgba(255,255,255,0.08); color: var(--text); }
    .type-tab.active {
      background: rgba(91,141,238,0.12);
      border-color: rgba(91,141,238,0.4);
      color: var(--blue-btn);
    }
    .type-tab .tab-icon { font-size: 16px; line-height: 1; }
    .type-tab .tab-count {
      font-size: 10px; font-weight: 700;
      background: rgba(91,141,238,0.25);
      color: var(--blue-btn);
      border-radius: 10px; padding: 1px 6px;
      min-width: 18px; text-align: center;
      display: none;
    }
    .type-tab.active .tab-count { display: inline-block; }
    .type-tab.has-progress .tab-count { display: inline-block; }

    /* ── Progress bar ── */
    .progress-wrap {
      padding: 0 16px 14px;
      max-width: 640px; margin: 0 auto;
    }
    .progress-meta {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-bottom: 7px;
    }
    .progress-label { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--blue); }
    .progress-pct   { font-size: 13px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
    .progress-bar   { height: 5px; background: rgba(130,160,204,0.15); border-radius: 99px; overflow: hidden; }
    .progress-fill  {
      height: 100%; border-radius: 99px;
      background: linear-gradient(90deg, var(--blue-btn), var(--green));
      transition: width 0.35s cubic-bezier(0.25,0.46,0.45,0.94);
      width: 0%;
    }
    .progress-fill.complete { background: var(--green); }

    /* ── Sections ── */
    .sections { padding: 0 16px; max-width: 640px; margin: 0 auto; }
    .section  { margin-bottom: 12px; }
    .section-head {
      font-size: 11px; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--blue); margin-bottom: 8px;
      display: flex; align-items: center; gap: 8px;
    }
    .section-head::after {
      content: ''; flex: 1; height: 1px;
      background: rgba(130,160,204,0.12);
    }

    /* ── Field item (number/text input inside checklist) ── */
    .field-item {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 14px;
      background: var(--check-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 6px;
    }
    .field-item-label {
      font-size: 14px; font-weight: 500; color: var(--text); flex: 1;
    }
    .field-item-input {
      width: 72px; padding: 7px 10px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(130,160,204,0.3);
      border-radius: 7px;
      color: var(--text); font-family: inherit;
      font-size: 15px; font-weight: 700; text-align: center;
      outline: none; -webkit-appearance: none;
      transition: border-color 0.15s, background 0.15s;
    }
    .field-item-input:focus {
      border-color: rgba(91,141,238,0.6);
      background: rgba(255,255,255,0.12);
    }
    .field-item-input::placeholder { color: var(--text-dim); font-weight: 400; font-size: 13px; }

    /* ── Check items ── */
    .check-item {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 13px 14px;
      background: var(--check-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .check-item:hover  { background: rgba(130,160,204,0.12); }
    .check-item:active { background: rgba(130,160,204,0.18); }
    .check-item.done   {
      background: var(--check-done-bg);
      border-color: var(--check-done-border);
    }

    .checkbox {
      flex-shrink: 0;
      width: 22px; height: 22px;
      border-radius: 6px;
      border: 2px solid rgba(130,160,204,0.35);
      background: transparent;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, border-color 0.15s;
      margin-top: 1px;
    }
    .check-item.done .checkbox {
      background: var(--green);
      border-color: var(--green);
    }
    .checkbox svg { display: none; }
    .check-item.done .checkbox svg { display: block; }

    .check-text { flex: 1; }
    .check-label {
      font-size: 14px; font-weight: 500; color: var(--text);
      line-height: 1.4;
      transition: color 0.15s;
    }
    .check-item.done .check-label {
      color: var(--text-dim);
      text-decoration: line-through;
      text-decoration-color: rgba(255,255,255,0.2);
    }
    .check-sub {
      font-size: 11px; color: var(--text-dim);
      margin-top: 2px; line-height: 1.4;
    }
    .item-note {
      display: block; width: 100%; margin-top: 7px;
      padding: 5px 8px;
      background: transparent;
      border: 1px dashed rgba(130,160,204,0.18);
      border-radius: 6px;
      color: var(--text); font-family: inherit; font-size: 12px;
      outline: none; resize: none; overflow: hidden;
      transition: border-color 0.15s, background 0.15s;
      -webkit-appearance: none;
    }
    .item-note::placeholder { color: rgba(255,255,255,0.18); }
    .item-note:focus { border-color: rgba(130,160,204,0.45); background: rgba(255,255,255,0.05); }
    .item-note:not(:placeholder-shown) { border-color: rgba(130,160,204,0.3); }

    /* ── Notes area ── */
    .notes-wrap { padding: 0 16px 16px; max-width: 640px; margin: 0 auto; }
    .notes-label {
      font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--blue); margin-bottom: 8px;
      display: block;
    }
    .notes-input {
      width: 100%; min-height: 96px;
      padding: 13px 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text); font-family: inherit; font-size: 14px;
      line-height: 1.5; resize: vertical; outline: none;
      transition: border-color 0.15s, background 0.15s;
      -webkit-appearance: none;
    }
    .notes-input::placeholder { color: var(--text-dim); }
    .notes-input:focus { border-color: rgba(130,160,204,0.45); background: rgba(255,255,255,0.08); }

    /* ── Section photos (inline, compact row) ── */
    .sec-photos {
      display: flex; align-items: center; gap: 7px;
      padding: 8px 0 4px;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .sec-photos::-webkit-scrollbar { display: none; }
    .sec-photo-thumb {
      flex-shrink: 0; position: relative;
      width: 62px; height: 62px;
      border-radius: 8px; overflow: hidden;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.05);
    }
    .sec-photo-thumb img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .sec-photo-del {
      position: absolute; top: 3px; right: 3px;
      width: 18px; height: 18px;
      background: rgba(0,0,0,0.7); border: none; border-radius: 50%;
      color: #fff; font-size: 10px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      line-height: 1; padding: 0;
    }
    .sec-photo-add {
      flex-shrink: 0;
      width: 62px; height: 62px;
      border-radius: 8px;
      border: 1.5px dashed rgba(130,160,204,0.3);
      background: rgba(130,160,204,0.05);
      color: var(--blue); font-size: 22px;
      cursor: pointer; display: flex;
      align-items: center; justify-content: center;
      transition: background 0.15s, border-color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .sec-photo-add:hover { background: rgba(130,160,204,0.12); border-color: rgba(130,160,204,0.5); }

    /* ── Bottom actions ── */
    .bottom-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 12px 16px; background: var(--navy);
      border-top: 1px solid var(--border);
      display: flex; gap: 10px;
      z-index: 800;
    }
    .save-btn {
      flex: 1; padding: 13px;
      background: var(--blue-btn);
      border: none;
      color: #fff;
      border-radius: 8px; font-size: 15px; font-weight: 700;
      font-family: inherit; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 7px;
      transition: background 0.15s, opacity 0.15s;
    }
    .save-btn:hover:not(:disabled) { background: #4a7de0; }
    .save-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .save-btn.saved { background: #28a745; }

    .save-feedback {
      position: fixed; bottom: 72px; left: 50%;
      transform: translateX(-50%);
      background: #0c2d3a; border: 1px solid rgba(130,160,204,0.25);
      border-radius: 8px; padding: 10px 18px;
      font-size: 13px; font-weight: 600; white-space: nowrap;
      opacity: 0; transition: opacity 0.25s, transform 0.25s;
      transform: translateX(-50%) translateY(6px);
      pointer-events: none; z-index: 999;
    }
    .save-feedback.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .save-feedback.ok  { color: #6ee7b7; border-color: rgba(110,231,183,0.3); }
    .save-feedback.err { color: var(--red); border-color: rgba(224,112,112,0.3); }

    /* ── History view ── */
    #historyPanel { display: none; padding: 0 16px 20px; max-width: 640px; margin: 0 auto; }
    .hist-empty { text-align: center; color: var(--text-dim); font-size: 14px; padding: 60px 0; }
    .hist-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 14px 16px; margin-bottom: 10px;
      cursor: pointer; transition: border-color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .hist-card:hover { border-color: rgba(130,160,204,0.35); background: rgba(130,160,204,0.05); }
    .hist-card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .hist-type-icon { font-size: 18px; flex-shrink: 0; }
    .hist-client { font-size: 15px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hist-date { font-size: 11px; color: var(--text-dim); white-space: nowrap; flex-shrink: 0; }
    .hist-address { font-size: 13px; color: var(--text-dim); margin-bottom: 8px; padding-left: 28px; }
    .hist-meta { display: flex; flex-wrap: wrap; gap: 6px; padding-left: 28px; }
    .hist-tag {
      font-size: 11px; font-weight: 600; padding: 3px 8px;
      background: rgba(130,160,204,0.1); border-radius: 20px; color: var(--blue);
    }
    .hist-tag.green { background: rgba(52,199,89,0.1); color: var(--green); }
    .hist-expand { font-size: 11px; color: var(--text-dim); margin-top: 8px; padding-left: 28px; }
    .hist-detail { display: none; margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
    .hist-detail.open { display: block; }
    .hist-sec-title {
      font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--blue); margin: 10px 0 4px;
    }
    .hist-check { font-size: 13px; color: rgba(255,255,255,0.75); padding: 2px 0; }
    .hist-notes { font-size: 13px; color: var(--text-dim); white-space: pre-wrap; line-height: 1.5; }
    .hist-btn {
      background: none; border: 1px solid transparent; color: var(--text-dim);
      font-size: 12px; font-family: inherit; padding: 5px 10px;
      border-radius: 5px; cursor: pointer;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    .hist-btn:hover { color: var(--text); border-color: var(--border); }
    .hist-btn.active { color: var(--blue); border-color: rgba(130,160,204,0.25); background: rgba(130,160,204,0.07); }

    /* ── Print styles ── */
    @media print {
      .topbar, .bottom-bar, .type-tabs, .job-fields .clear-btn { display: none !important; }
      #mainScreen { padding-top: 10px !important; }
      body { background: #fff !important; color: #000 !important; }
      .check-item { border: 1px solid #ccc !important; background: #fff !important; page-break-inside: avoid; }
      .check-item.done .check-label { color: #888 !important; }
      .section-panel:not(.active-panel) { display: block !important; }
    }

    @media (max-width: 480px) {
      .topbar-label { display: none; }
      .topbar-link  { font-size: 10px; padding: 4px 8px; }
    }
  </style>
</head>
<body>

<!-- Login screen -->
<div id="loginScreen">
  <div class="login-card">
    <img src="/uploads/logo.png" alt="Ravelo AV Tech" />
    <h1>Site Walkthrough</h1>
    <p>Sign in to access job checklists.</p>
    <p id="loginError" style="display:none; color:#e5484d; font-size:13px; margin-bottom:16px;"></p>
    <button class="login-btn" id="loginBtn">Sign In</button>
  </div>
</div>

<!-- Main screen -->
<div id="mainScreen">

  <div class="topbar">
    <a class="topbar-logo" href="/" target="_blank">
      <img src="/uploads/logo.png" alt="Ravelo AV Tech" width="110" height="34" />
    </a>
    <div class="topbar-divider"></div>
    <span class="topbar-label">Site Walkthrough</span>
    <button class="topbar-logout" id="logoutBtn">Sign Out</button>
  </div>

  <!-- Tab bar -->
  <div class="tab-bar" id="mainTabBar">
    <a class="tab-btn" href="/admin/">🖼 Gallery</a>
    <a class="tab-btn restricted-tab" href="/admin/estimates.html">📋 Estimates</a>
    <a class="tab-btn active" href="/admin/walkthrough.html" id="tabWalkthrough">🏠 Walkthrough</a>
    <a class="tab-btn" href="/admin/walkthrough.html?view=history" id="tabHistory">📋 History</a>
  </div>

  <div id="checklistView">
  <!-- Job info -->
  <div class="job-header">
    <div class="job-fields">
      <input class="job-input" id="clientName" type="text" placeholder="Client name" autocomplete="off" />
      <input class="job-input" id="jobAddress" type="text" placeholder="Address / location" autocomplete="off" />
      <button class="clear-btn" id="clearBtn">Reset</button>
    </div>
  </div>

  <!-- Job type tabs -->
  <div class="type-tabs">
    <button class="type-tab active" data-type="cameras">
      <span class="tab-icon">📷</span> Security Cameras
      <span class="tab-count" id="count-cameras">0</span>
    </button>
    <button class="type-tab" data-type="network">
      <span class="tab-icon">🌐</span> Network
      <span class="tab-count" id="count-network">0</span>
    </button>
    <button class="type-tab" data-type="av">
      <span class="tab-icon">📺</span> Audio / Visual
      <span class="tab-count" id="count-av">0</span>
    </button>
  </div>

  <!-- Progress -->
  <div class="progress-wrap">
    <div class="progress-meta">
      <span class="progress-label" id="progressLabel">Survey</span>
      <span class="progress-pct" id="progressPct">0 / 0</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <!-- Checklists (one panel per type) -->
  <div id="panels"></div>

  <!-- Hidden file input for camera capture -->
  <input type="file" id="photoInput" accept="image/*" style="display:none;" multiple />

  <!-- Notes -->
  <div class="notes-wrap">
    <label class="notes-label" for="jobNotes">Field Notes</label>
    <textarea class="notes-input" id="jobNotes" placeholder="Measurements, obstacles, client requests, photos needed…"></textarea>
  </div>

  </div><!-- /#checklistView -->

  <!-- History panel -->
  <div id="historyPanel"></div>

</div>

<!-- Bottom bar -->
<div class="save-feedback" id="saveFeedback"></div>
<div class="bottom-bar" id="bottomBar" style="display:none;">
  <button class="save-btn" id="saveBtn">💾 Save &amp; Send</button>
</div>

<script>
(function () {
  'use strict';

  /* ── Checklist data ──────────────────────────────────────────────────── */
  var CHECKLISTS = {
    cameras: {
      label: 'Camera Survey',
      sections: [
        {
          title: 'Camera Locations',
          items: [
            { id: 'cam-num',      type: 'field', label: 'Number of cameras', placeholder: '0', inputType: 'number' },
            { id: 'cam-indoor',   label: 'Indoor camera positions marked', hint: 'Corners, hallways, entry points' },
            { id: 'cam-outdoor',  label: 'Outdoor camera positions marked', hint: 'Driveways, doors, perimeter' },
            { id: 'cam-fov',      label: 'Field of view verified at each location' },
            { id: 'cam-lighting', label: 'Lighting conditions assessed', hint: 'Night vision needed? Backlight issues?' },
          ]
        },
        {
          title: 'Mounting & Cabling',
          items: [
            { id: 'cam-attic',    label: 'Attic access available', hint: 'Can route cable through ceiling / top of walls' },
            { id: 'cam-crawl',    label: 'Crawl space accessible', hint: 'Can route cable under floor / bottom of walls' },
            { id: 'cam-surface',  label: 'Mounting surface identified at each point', hint: 'Drywall / wood / brick / soffit / ceiling' },
            { id: 'cam-power',    label: 'Power outlet accessible near each camera (PoE or plug-in)' },
            { id: 'cam-routing',  label: 'Cable routing path mapped from camera to NVR' },
            { id: 'cam-existing', label: 'Existing cable runs checked and labeled' },
            { id: 'cam-distance', label: 'Max cable run distance measured', hint: '300 ft max for Cat6 PoE' },
          ]
        },
        {
          title: 'Recorder (NVR / DVR)',
          items: [
            { id: 'nvr-location', label: 'NVR/DVR location confirmed' },
            { id: 'nvr-power',    label: 'Power outlet at NVR location' },
            { id: 'nvr-network',  label: 'Network / internet access at NVR' },
            { id: 'nvr-monitor',  label: 'Monitor or TV for local view decided' },
            { id: 'nvr-storage',  label: 'Storage size / retention days confirmed', hint: 'e.g. 30-day loop on 2TB' },
          ]
        },
        {
          title: 'Client Requirements',
          items: [
            { id: 'cam-app',      label: 'Mobile app access needed' },
            { id: 'cam-alerts',   label: 'Motion zone alerts configured' },
            { id: 'cam-existing2',label: 'Client has existing system to integrate or replace' },
            { id: 'cam-photos',   label: 'Photos taken of all camera locations' },
          ]
        }
      ]
    },

    network: {
      label: 'Network Survey',
      sections: [
        {
          title: 'ISP & Core',
          items: [
            { id: 'net-isp',      label: 'ISP modem / ONT location marked' },
            { id: 'net-speed',    label: 'Internet speed confirmed with client', hint: 'Run speedtest if possible' },
            { id: 'net-router',   label: 'Main router location decided' },
            { id: 'net-panel',    label: 'Structured media center or closet identified' },
            { id: 'net-coax',     label: 'Existing coax or Ethernet runs noted' },
          ]
        },
        {
          title: 'Wired Drops',
          items: [
            { id: 'net-drops',    label: 'Rooms needing Ethernet drops listed' },
            { id: 'net-routing',  label: 'Cable routing path planned per room', hint: 'Attic / crawl space / walls' },
            { id: 'net-switch',   label: 'Switch location and rack space confirmed' },
            { id: 'net-poe',      label: 'PoE switch needed (for cameras, APs, VoIP)' },
          ]
        },
        {
          title: 'Wireless Coverage',
          items: [
            { id: 'net-dead',     label: 'Dead zones identified and walked', hint: 'Garage, backyard, basement' },
            { id: 'net-aps',      label: 'Number of access points determined' },
            { id: 'net-apmount',  label: 'AP mounting locations confirmed', hint: 'Ceiling mount preferred' },
            { id: 'net-backhaul', label: 'Wired backhaul to each AP possible' },
          ]
        },
        {
          title: 'Protection & Finish',
          items: [
            { id: 'net-ups',      label: 'UPS / battery backup for router + modem' },
            { id: 'net-surge',    label: 'Surge protection at main panel location' },
            { id: 'net-label',    label: 'Labeling plan for all drops and ports' },
            { id: 'net-photos',   label: 'Photos taken of key infrastructure locations' },
          ]
        }
      ]
    },

    av: {
      label: 'AV Survey',
      sections: [
        {
          title: 'Displays & Mounting',
          items: [
            { id: 'av-tvloc',     label: 'TV / display locations confirmed' },
            { id: 'av-tvsize',    label: 'TV sizes agreed — wall space measured' },
            { id: 'av-walltype',  label: 'Wall type at each mount', hint: 'Drywall / concrete / brick / tile / fireplace' },
            { id: 'av-studs',     label: 'Stud locations found — blocking needed?' },
            { id: 'av-height',    label: 'Viewing height and angle confirmed with client' },
            { id: 'av-outlet',    label: 'Power outlet behind or near each TV' },
          ]
        },
        {
          title: 'Audio',
          items: [
            { id: 'av-soundbar',  label: 'Soundbar location and clearance confirmed' },
            { id: 'av-speakers',  label: 'In-ceiling / in-wall speaker positions marked' },
            { id: 'av-ceiling',   label: 'Ceiling type confirmed at each speaker location', hint: 'Drywall / plaster / coffered / vaulted / drop ceiling' },
            { id: 'av-attic',     label: 'Attic access available for speaker wire routing', hint: 'Can run wire above ceiling to amp / receiver' },
            { id: 'av-spksurf',   label: 'Mounting surface confirmed at each speaker', hint: 'Drywall / wood backing / plaster — blocking needed?' },
            { id: 'av-spksize',   type: 'field', label: 'Speaker size', placeholder: 'e.g. 6.5"', inputType: 'text' },
            { id: 'av-amp',       label: 'Receiver / amplifier location decided' },
            { id: 'av-subwoofer', label: 'Subwoofer placement confirmed' },
            { id: 'av-zones',     label: 'Multi-zone audio areas noted', hint: 'Patio, kitchen, bedroom' },
          ]
        },
        {
          title: 'Sources & Cabling',
          items: [
            { id: 'av-sources',   label: 'HDMI sources listed', hint: 'Cable box, Apple TV, gaming console, PC' },
            { id: 'av-inwall',    label: 'In-wall cable routing possible', hint: 'HDMI, power, speaker wire' },
            { id: 'av-raceway',   label: 'Surface raceway acceptable where in-wall not possible' },
            { id: 'av-hdmirun',   label: 'HDMI run length noted', hint: 'Over 25 ft may need active cable or extender' },
          ]
        },
        {
          title: 'Control & Finish',
          items: [
            { id: 'av-rackloc',   type: 'field', label: 'Rack / closet location', placeholder: 'e.g. Living room closet', inputType: 'text' },
            { id: 'av-rackpower', label: 'Power available at rack / closet location' },
            { id: 'av-rack',      label: 'Rack size and ventilation confirmed' },
            { id: 'av-remote',    label: 'Universal remote or smart home control decided' },
            { id: 'av-existing',  label: 'Existing equipment inventoried', hint: 'What stays, what gets replaced' },
            { id: 'av-photos',    label: 'Photos taken of all TV walls and equipment areas' },
          ]
        }
      ]
    }
  };

  /* ── State ───────────────────────────────────────────────────────────── */
  var STORAGE_KEY = 'rav_walkthrough_v1';
  var state = load();
  var currentType = state.type || 'cameras';

  function load() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; }
  }
  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  /* ── Auth ────────────────────────────────────────────────────────────── */
  var loginScreen = document.getElementById('loginScreen');
  var mainScreen  = document.getElementById('mainScreen');
  var bottomBar   = document.getElementById('bottomBar');
  // Access = any Netlify Identity account (invite-only). The server functions
  // only require a valid Identity JWT, so a client-side email list adds no
  // real protection — manage access by inviting/removing users in Netlify.

  var RESTRICTED_USERS = ['gaven.certeza@raveloavtech.com'];

  function showMain() {
    loginScreen.style.display = 'none';
    mainScreen.style.display = 'block';
    bottomBar.style.display = 'flex';
    var user = netlifyIdentity.currentUser();
    if (user && RESTRICTED_USERS.indexOf(user.email) !== -1) {
      document.querySelectorAll('.restricted-tab').forEach(function (el) { el.style.display = 'none'; });
    }
    init();
    if (new URLSearchParams(window.location.search).get('view') === 'history') {
      showHistoryView();
    }
  }
  function showLogin(errorMsg) {
    loginScreen.style.display = 'flex';
    mainScreen.style.display = 'none';
    bottomBar.style.display = 'none';
    var errEl = document.getElementById('loginError');
    if (errorMsg) { errEl.textContent = errorMsg; errEl.style.display = 'block'; }
    else { errEl.style.display = 'none'; }
  }
  function checkAccess() {
    var user = netlifyIdentity.currentUser();
    if (user) showMain(); else showLogin();
  }

  document.getElementById('loginBtn').addEventListener('click', function () { netlifyIdentity.open(); });
  document.getElementById('logoutBtn').addEventListener('click', function () { netlifyIdentity.logout(); });
  netlifyIdentity.on('login', function () { netlifyIdentity.close(); checkAccess(); });
  netlifyIdentity.on('logout', function () { showLogin(); });
  netlifyIdentity.on('init', function (u) { if (u) checkAccess(); else showLogin(); });

  /* ── Build UI ────────────────────────────────────────────────────────── */
  function init() {
    buildPanels();
    bindTabs();
    bindJobFields();
    bindActions();
    restoreJobFields();
    switchType(currentType);
  }

  /* ── Photo capture & compression ────────────────────────────────────────── */
  var photoInput    = document.getElementById('photoInput');
  var activePhotoType = null;

  photoInput.addEventListener('change', function () {
    var files = Array.from(photoInput.files);
    photoInput.value = '';
    if (!files.length || !activePhotoType) return;
    var secKey = activePhotoType;
    files.forEach(function (file) {
      compressPhoto(file, function (dataUrl) {
        if (!state.photos) state.photos = {};
        if (!state.photos[secKey]) state.photos[secKey] = [];
        state.photos[secKey].push({ data: dataUrl, ts: Date.now() });
        save();
        renderPhotos(secKey);
      });
    });
  });

  function compressPhoto(file, cb) {
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function () {
      var maxW = 1200, maxH = 1200;
      var w = img.width, h = img.height;
      if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
      if (h > maxH) { w = Math.round(w * maxH / h); h = maxH; }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL('image/jpeg', 0.78));
      URL.revokeObjectURL(url);
    };
    img.src = url;
  }

  function renderPhotos(secKey) {
    var row    = document.querySelector('.sec-photos[data-seckey="' + secKey + '"]');
    if (!row) return;
    var photos = (state.photos && state.photos[secKey]) || [];

    row.innerHTML = '';
    photos.forEach(function (p, idx) {
      var thumb = document.createElement('div');
      thumb.className = 'sec-photo-thumb';
      thumb.innerHTML =
        '<img src="' + p.data + '" alt="Photo ' + (idx + 1) + '" />' +
        '<button class="sec-photo-del" title="Remove">✕</button>';
      thumb.querySelector('.sec-photo-del').addEventListener('click', function (e) {
        e.stopPropagation();
        state.photos[secKey].splice(idx, 1);
        save();
        renderPhotos(secKey);
      });
      row.appendChild(thumb);
    });

    var addBtn = document.createElement('button');
    addBtn.className = 'sec-photo-add';
    addBtn.innerHTML = '📷';
    addBtn.title = 'Add photo';
    addBtn.addEventListener('click', function () {
      activePhotoType = secKey;
      photoInput.click();
    });
    row.appendChild(addBtn);
  }

  function buildPanels() {
    var container = document.getElementById('panels');
    container.innerHTML = '';
    Object.keys(CHECKLISTS).forEach(function (type) {
      var cl = CHECKLISTS[type];
      var panel = document.createElement('div');
      panel.className = 'section-panel';
      panel.dataset.type = type;
      panel.style.display = 'none';

      cl.sections.forEach(function (sec) {
        var secEl = document.createElement('div');
        secEl.className = 'sections';
        var headEl = document.createElement('div');
        headEl.className = 'section';
        headEl.innerHTML = '<div class="section-head">' + sec.title + '</div>';

        sec.items.forEach(function (item) {
          if (item.type === 'field') {
            var fieldDiv = document.createElement('div');
            fieldDiv.className = 'field-item';
            var savedVal = (state.fields && state.fields[item.id]) || '';
            fieldDiv.innerHTML =
              '<div class="field-item-label">' + item.label + '</div>' +
              '<input class="field-item-input" type="' + (item.inputType || 'text') + '" ' +
                'placeholder="' + (item.placeholder || '') + '" ' +
                'value="' + savedVal + '" min="0" />';
            var inp = fieldDiv.querySelector('input');
            inp.addEventListener('input', function () {
              if (!state.fields) state.fields = {};
              state.fields[item.id] = inp.value;
              save();
            });
            inp.addEventListener('click', function (e) { e.stopPropagation(); });
            headEl.appendChild(fieldDiv);
            return;
          }

          var done = !!(state.checks && state.checks[item.id]);
          var div = document.createElement('div');
          div.className = 'check-item' + (done ? ' done' : '');
          div.dataset.id = item.id;
          div.innerHTML =
            '<div class="checkbox">' +
              '<svg width="12" height="9" viewBox="0 0 12 9" fill="none">' +
                '<path d="M1 4L4.5 7.5L11 1" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>' +
              '</svg>' +
            '</div>' +
            '<div class="check-text">' +
              '<div class="check-label">' + item.label + '</div>' +
              (item.hint ? '<div class="check-sub">' + item.hint + '</div>' : '') +
              '<textarea class="item-note" rows="1" placeholder="add a note…"></textarea>' +
            '</div>';
          var noteEl = div.querySelector('.item-note');
          // Restore saved note
          if (state.item_notes && state.item_notes[item.id]) noteEl.value = state.item_notes[item.id];
          // Auto-grow
          noteEl.addEventListener('input', function () {
            noteEl.style.height = 'auto';
            noteEl.style.height = noteEl.scrollHeight + 'px';
            if (!state.item_notes) state.item_notes = {};
            state.item_notes[item.id] = noteEl.value;
            save();
          });
          noteEl.addEventListener('click', function (e) { e.stopPropagation(); });
          div.addEventListener('click', function () { toggle(type, item.id, div); });
          headEl.appendChild(div);
        });

        // Photo row at bottom of each section
        var secKey  = type + '-' + sec.title.replace(/\s+/g, '_');
        var photoRow = document.createElement('div');
        photoRow.className = 'sec-photos';
        photoRow.dataset.seckey = secKey;
        headEl.appendChild(photoRow);
        // render after DOM insertion so querySelector works
        setTimeout(function (k) { return function () { renderPhotos(k); }; }(secKey), 0);

        secEl.appendChild(headEl);
        panel.appendChild(secEl);
      });

      container.appendChild(panel);
    });
  }

  function toggle(type, id, el) {
    if (!state.checks) state.checks = {};
    var isDone = !!state.checks[id];
    state.checks[id] = !isDone;
    el.classList.toggle('done', !isDone);
    save();
    updateProgress(type);
    updateTabCount(type);
  }

  /* ── Tabs ────────────────────────────────────────────────────────────── */
  function bindTabs() {
    document.querySelectorAll('.type-tab').forEach(function (btn) {
      btn.addEventListener('click', function () {
        switchType(btn.dataset.type);
      });
    });
  }

  function switchType(type) {
    currentType = type;
    state.type = type;
    save();

    document.querySelectorAll('.type-tab').forEach(function (btn) {
      btn.classList.toggle('active', btn.dataset.type === type);
    });
    document.querySelectorAll('.section-panel').forEach(function (p) {
      p.style.display = p.dataset.type === type ? 'block' : 'none';
    });

    document.getElementById('progressLabel').textContent = CHECKLISTS[type].label;
    updateProgress(type);
    Object.keys(CHECKLISTS).forEach(updateTabCount);
  }

  function updateProgress(type) {
    var cl = CHECKLISTS[type];
    var total = 0, done = 0;
    cl.sections.forEach(function (s) {
      s.items.forEach(function (item) {
        total++;
        if (state.checks && state.checks[item.id]) done++;
      });
    });
    var pct = total ? Math.round(done / total * 100) : 0;
    document.getElementById('progressPct').textContent = done + ' / ' + total;
    var fill = document.getElementById('progressFill');
    fill.style.width = pct + '%';
    fill.classList.toggle('complete', pct === 100);
  }

  function updateTabCount(type) {
    var cl = CHECKLISTS[type];
    var done = 0, total = 0;
    cl.sections.forEach(function (s) {
      s.items.forEach(function (item) {
        total++;
        if (state.checks && state.checks[item.id]) done++;
      });
    });
    var countEl = document.getElementById('count-' + type);
    countEl.textContent = done + '/' + total;
    var tab = document.querySelector('.type-tab[data-type="' + type + '"]');
    tab.classList.toggle('has-progress', done > 0);
  }

  /* ── Job fields ──────────────────────────────────────────────────────── */
  function bindJobFields() {
    var cn = document.getElementById('clientName');
    var ja = document.getElementById('jobAddress');
    cn.addEventListener('input', function () { state.clientName = cn.value; save(); });
    ja.addEventListener('input', function () { state.jobAddress = ja.value; save(); });
  }
  function restoreJobFields() {
    if (state.clientName) document.getElementById('clientName').value = state.clientName;
    if (state.jobAddress) document.getElementById('jobAddress').value = state.jobAddress;
    if (state.notes) document.getElementById('jobNotes').value = state.notes;
  }

  /* ── Actions ─────────────────────────────────────────────────────────── */
  function bindActions() {
    document.getElementById('clearBtn').addEventListener('click', function () {
      if (!confirm('Clear all checkboxes and reset? This cannot be undone.')) return;
      state = { type: currentType };
      localStorage.removeItem(STORAGE_KEY);
      document.getElementById('clientName').value = '';
      document.getElementById('jobAddress').value = '';
      document.getElementById('jobNotes').value = '';
      buildPanels();
      switchType(currentType);
    });

    document.getElementById('jobNotes').addEventListener('input', function () {
      state.notes = document.getElementById('jobNotes').value;
      save();
    });

    var saveBtn    = document.getElementById('saveBtn');
    var feedbackEl = document.getElementById('saveFeedback');
    var feedbackTimer;

    function showFeedback(msg, type) {
      clearTimeout(feedbackTimer);
      feedbackEl.textContent = msg;
      feedbackEl.className = 'save-feedback show ' + (type || 'ok');
      feedbackTimer = setTimeout(function () { feedbackEl.className = 'save-feedback'; }, 4000);
    }

    saveBtn.addEventListener('click', function () {
      if (saveBtn.disabled) return;
      saveBtn.disabled = true;
      saveBtn.textContent = '⏳ Saving…';

      var user = netlifyIdentity.currentUser();
      if (!user) {
        saveBtn.disabled = false;
        saveBtn.textContent = '💾 Save & Send';
        showFeedback('Not signed in', 'err');
        return;
      }

      user.jwt().then(function (token) {
        return fetch('/.netlify/functions/save-walkthrough', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token,
          },
          body: JSON.stringify({
            clientName: state.clientName || '',
            jobAddress: state.jobAddress || '',
            type:       state.type || currentType,
            checks:     state.checks || {},
            fields:     state.fields || {},
            item_notes: state.item_notes || {},
            notes:      state.notes  || '',
            photos:     (function () {
              var t = state.type || currentType;
              var cl = CHECKLISTS[t];
              if (!cl || !state.photos) return [];
              var all = [];
              cl.sections.forEach(function (sec) {
                var k = t + '-' + sec.title.replace(/\s+/g, '_');
                var arr = state.photos[k] || [];
                arr.forEach(function (p) { all.push({ data: p.data, section: sec.title }); });
              });
              return all;
            }()),
          }),
        });
      }).then(function (r) {
        return r.json().then(function (d) { return { ok: r.ok, data: d }; });
      }).then(function (res) {
        saveBtn.disabled = false;
        if (res.ok && res.data.ok) {
          saveBtn.textContent = '✅ Saved';
          saveBtn.classList.add('saved');
          showFeedback('✅ Saved — summary sent to the team', 'ok');
          // Clear all fields after successful save
          state = { type: currentType };
          localStorage.removeItem(STORAGE_KEY);
          document.getElementById('clientName').value = '';
          document.getElementById('jobAddress').value = '';
          document.getElementById('jobNotes').value = '';
          buildPanels();
          switchType(currentType);
          setTimeout(function () {
            saveBtn.textContent = '💾 Save & Send';
            saveBtn.classList.remove('saved');
          }, 3000);
        } else {
          saveBtn.textContent = '💾 Save & Send';
          showFeedback('❌ Error: ' + ((res.data && res.data.error) || 'try again'), 'err');
        }
      }).catch(function (err) {
        saveBtn.disabled = false;
        saveBtn.textContent = '💾 Save & Send';
        showFeedback('❌ ' + err.message, 'err');
      });
    });
  }

  /* ── History ─────────────────────────────────────────────────────────── */
  var historyPanel  = document.getElementById('historyPanel');
  var checklistView = document.getElementById('checklistView');
  var tabWalkthrough = document.getElementById('tabWalkthrough');
  var tabHistory     = document.getElementById('tabHistory');

  var TYPE_ICONS_H  = { cameras: '📷', network: '🌐', av: '📺' };
  var TYPE_LABELS_H = { cameras: 'Security Cameras', network: 'Network', av: 'Audio / Visual' };

  function showHistoryView() {
    tabHistory.classList.add('active');
    tabWalkthrough.classList.remove('active');
    checklistView.style.display = 'none';
    document.getElementById('bottomBar').style.display = 'none';
    historyPanel.style.display = 'block';
    loadHistory();
  }

  function showChecklistView() {
    tabWalkthrough.classList.add('active');
    tabHistory.classList.remove('active');
    checklistView.style.display = '';
    document.getElementById('bottomBar').style.display = 'flex';
    historyPanel.style.display = 'none';
  }

  tabHistory.addEventListener('click', function (e) {
    e.preventDefault();
    showHistoryView();
  });
  tabWalkthrough.addEventListener('click', function (e) {
    e.preventDefault();
    showChecklistView();
  });

  function loadHistory() {
    historyPanel.innerHTML = '<p class="hist-empty">Loading…</p>';
    var user = netlifyIdentity.currentUser();
    if (!user) { historyPanel.innerHTML = '<p class="hist-empty">Not signed in.</p>'; return; }
    user.jwt().then(function (token) {
      return fetch('/.netlify/functions/get-walkthroughs', {
        headers: { Authorization: 'Bearer ' + token }
      });
    }).then(function (r) {
      return r.json().then(function (d) { return { ok: r.ok, data: d }; });
    }).then(function (res) {
      if (!res.ok) {
        historyPanel.innerHTML = '<p class="hist-empty" style="color:var(--red)">Error ' + (res.data.error || 'loading history') + '</p>';
        return;
      }
      var records = res.data;
      if (!Array.isArray(records) || !records.length) {
        historyPanel.innerHTML = '<p class="hist-empty">No walkthroughs saved yet.</p>';
        return;
      }
      historyPanel.innerHTML = records.map(buildHistCard).join('');
      historyPanel.querySelectorAll('.hist-card').forEach(function (card) {
        card.addEventListener('click', function () {
          var det = card.querySelector('.hist-detail');
          if (det) det.classList.toggle('open');
        });
      });
    }).catch(function (err) {
      historyPanel.innerHTML = '<p class="hist-empty" style="color:var(--red)">Error: ' + err.message + '</p>';
    });
  }

  function buildHistCard(r) {
    var icon      = TYPE_ICONS_H[r.type]  || '🔧';
    var typeLabel = TYPE_LABELS_H[r.type] || r.type || 'Unknown';
    var client    = r.clientName || 'Unknown client';
    var addr      = r.jobAddress || '';
    var checked   = Object.values(r.checks || {}).filter(Boolean).length;
    var photos    = r.photoCount || 0;

    // Friendly date from savedAt or key timestamp
    var date = r.savedAt || '';
    if (!date && r.key) {
      var ts = parseInt(r.key.replace('walkthrough-', ''), 10);
      if (!isNaN(ts)) date = new Date(ts).toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
    }

    // Build checked-items detail
    var cl = CHECKLISTS[r.type];
    var detailHtml = '';
    if (cl) {
      cl.sections.forEach(function (sec) {
        var fieldRows = sec.items.filter(function (i) { return i.type === 'field' && r.fields && r.fields[i.id]; });
        var checkRows = sec.items.filter(function (i) { return i.type !== 'field' && r.checks && r.checks[i.id]; });
        if (!fieldRows.length && !checkRows.length) return;
        detailHtml += '<div class="hist-sec-title">' + sec.title + '</div>';
        fieldRows.forEach(function (i) {
          detailHtml += '<div class="hist-check">📝 ' + i.label + ': <strong>' + r.fields[i.id] + '</strong></div>';
        });
        checkRows.forEach(function (i) {
          detailHtml += '<div class="hist-check">✅ ' + i.label + '</div>';
        });
      });
    }
    if (r.notes) {
      detailHtml += '<div class="hist-sec-title">Field Notes</div><div class="hist-notes">' + r.notes + '</div>';
    }

    return '<div class="hist-card">' +
      '<div class="hist-card-top">' +
        '<span class="hist-type-icon">' + icon + '</span>' +
        '<span class="hist-client">' + client + '</span>' +
        '<span class="hist-date">' + date + '</span>' +
      '</div>' +
      (addr ? '<div class="hist-address">📍 ' + addr + '</div>' : '') +
      '<div class="hist-meta">' +
        '<span class="hist-tag">' + typeLabel + '</span>' +
        (checked ? '<span class="hist-tag green">✅ ' + checked + ' checked</span>' : '') +
        (photos  ? '<span class="hist-tag">📷 ' + photos + ' photos</span>' : '') +
      '</div>' +
      (detailHtml ? '<div class="hist-expand">Tap to expand</div><div class="hist-detail">' + detailHtml + '</div>' : '') +
    '</div>';
  }

})();
</script>
</body>
</html>
