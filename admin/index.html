<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager — Ravelo AV Tech</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    /* Warning banner */
    .rav-tip {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 99999;
      background: #0c2d3a;
      border-top: 2px solid #82A0CC;
      color: rgba(255,255,255,0.75);
      font: 12px/1.5 sans-serif;
      padding: 8px 20px;
      text-align: center;
    }
    .rav-tip strong { color: #82A0CC; }

    /* Lock message injected by JS */
    .rav-lock-msg {
      display: block;
      margin-top: 8px;
      padding: 7px 12px;
      background: rgba(224,112,112,0.1);
      border: 1px solid rgba(224,112,112,0.35);
      border-radius: 3px;
      color: #e07070;
      font: 600 11px/1.5 sans-serif;
    }
  </style>
</head>
<body>
  <div class="rav-tip">
    <strong>📸 Galería:</strong>
    para <strong>cambiar</strong> una foto existente →
    usa el ícono 🗑 para <strong>eliminar</strong> esa entrada y luego
    <strong>agrega una nueva</strong> al final.
  </div>

  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
  (function () {
    var locked = new WeakSet();

    function lockExisting() {
      // The native image widget renders a preview <img> for existing photos.
      // We find those images, walk up to the widget container, and drop an
      // overlay on the clickable/upload area — keeping the Remove button free.
      var imgs = document.querySelectorAll('img');

      imgs.forEach(function (img) {
        var src = img.src || '';

        // Only target gallery-sized photos (skip logos, icons, thumbnails)
        if (img.naturalWidth < 80 && img.width < 80) return;
        if (!src || src.startsWith('data:')) return;
        if (locked.has(img)) return;
        locked.add(img);

        // Walk up to find the widget container that also holds buttons
        var box = img.parentElement;
        for (var i = 0; i < 8; i++) {
          if (!box || box === document.body) return;
          if (box.querySelectorAll('button').length > 0) break;
          box = box.parentElement;
        }
        if (!box || locked.has(box)) return;
        locked.add(box);

        // Disable every button except Remove / Clear / Delete
        box.querySelectorAll('button').forEach(function (btn) {
          var txt = (btn.textContent || btn.innerText || '').trim().toLowerCase();
          var lbl = (btn.getAttribute('aria-label') || '').toLowerCase();
          if (/remove|clear|delete|trash|×|✕/i.test(txt + lbl)) return;
          btn.disabled = true;
          btn.style.opacity = '0.3';
          btn.style.cursor = 'not-allowed';
          btn.style.pointerEvents = 'none';
        });

        // Disable hidden file inputs inside the widget
        box.querySelectorAll('input[type="file"]').forEach(function (fi) {
          fi.disabled = true;
        });

        // Add inline message (no absolute overlay — avoids bleeding onto adjacent entries)
        if (!box.querySelector('.rav-lock-msg')) {
          var msg = document.createElement('span');
          msg.className = 'rav-lock-msg';
          msg.textContent = '🔒 Foto bloqueada — para cambiarla: borra esta entrada (🗑) y agrega una nueva con "Add".';
          box.appendChild(msg);
        }
      });
    }

    // Run once a second for the first 30 seconds after load,
    // then keep watching for new DOM changes (user opens a list item).
    var ticks = 0;
    var iv = setInterval(function () {
      lockExisting();
      if (++ticks > 30) clearInterval(iv);
    }, 1000);

    new MutationObserver(lockExisting)
      .observe(document.body, { childList: true, subtree: true });
  })();
  </script>
</body>
</html>
