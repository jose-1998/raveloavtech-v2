<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <link rel="manifest" href="/admin/manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ravelo Admin" />
  <link rel="apple-touch-icon" href="/admin/icon.png" />
  <title>Content Manager — Ravelo AV Tech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,600;0,700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="/uploads/favicon.png" />
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:       #0c2d3a;
      --navy-dark:  #0d1b2a;
      --navy-mid:   #0a2030;
      --blue:       #82A0CC;
      --blue-btn:   #5b8dee;
      --red:        #e07070;
      --text:       rgba(255,255,255,0.88);
      --text-dim:   rgba(255,255,255,0.45);
      --border:     rgba(130,160,204,0.13);
      --green:      #34c759;
      --card-shadow: 0 2px 12px rgba(0,0,0,0.35), 0 1px 3px rgba(0,0,0,0.25);
      --card-shadow-hover: 0 4px 20px rgba(0,0,0,0.45), 0 2px 6px rgba(0,0,0,0.3);
    }

    html, body {
      height: 100%;
      background: var(--navy-dark);
      font-family: 'Figtree', -apple-system, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Top bar ── */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 900;
      height: 60px;
      background: rgba(12,45,58,0.97);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(130,160,204,0.18);
      box-shadow: 0 1px 0 rgba(0,0,0,0.2), 0 4px 16px rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 12px;
    }
    .topbar-logo img { height: 36px; width: auto; display: block; }
    .topbar-divider  { width: 1px; height: 22px; background: rgba(130,160,204,0.2); flex-shrink: 0; }
    .topbar-label    { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--blue); font-weight: 600; opacity: 0.8; }
    .topbar-badge    {
      margin-left: auto;
      background: rgba(130,160,204,0.1);
      border: 1px solid rgba(130,160,204,0.2);
      color: var(--blue);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 700;
    }
    .topbar-publish {
      background: transparent;
      border: 1px solid rgba(130,160,204,0.2);
      color: rgba(255,255,255,0.25);
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      padding: 7px 16px;
      border-radius: 8px;
      cursor: default;
      white-space: nowrap;
      letter-spacing: 0.02em;
      transition: background 0.2s, color 0.2s, border-color 0.2s, box-shadow 0.2s, transform 0.15s;
    }
    .topbar-publish.dirty {
      background: var(--blue-btn);
      border-color: var(--blue-btn);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 0 0 0 rgba(91,141,238,0.5), 0 2px 8px rgba(91,141,238,0.4);
      animation: pulse-pub 1.8s ease-in-out infinite;
    }
    .topbar-publish.dirty:hover { background: #4a7de0; transform: translateY(-1px); box-shadow: 0 4px 14px rgba(91,141,238,0.5); }
    .topbar-publish.dirty:active { background: #4a7de0; transform: translateY(0); }
    @keyframes pulse-pub {
      0%, 100% { box-shadow: 0 0 0 0 rgba(91,141,238,0.45), 0 2px 8px rgba(91,141,238,0.4); }
      50%       { box-shadow: 0 0 0 8px rgba(91,141,238,0), 0 2px 8px rgba(91,141,238,0.4); }
    }

    .topbar-logout {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-dim);
      font-size: 11px;
      font-family: inherit;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      letter-spacing: 0.04em;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .topbar-logout:hover {
      background: rgba(224,112,112,0.1);
      border-color: rgba(224,112,112,0.35);
      color: var(--red);
    }

    /* ── Mode selector ── */
    #modeScreen {
      display: none; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px;
      background: radial-gradient(ellipse at 50% 30%, rgba(91,141,238,0.07) 0%, transparent 70%);
    }
    .mode-wrap { width: 100%; max-width: 560px; text-align: center; }
    .mode-logo { height: 48px; width: auto; margin: 0 auto 10px; display: block; }
    .mode-greeting { font-size: 13px; color: var(--text-dim); margin-bottom: 32px; }
    .mode-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .mode-card {
      background: var(--navy); border: 1px solid rgba(130,160,204,0.15);
      border-radius: 16px; padding: 32px 20px 28px; cursor: pointer;
      transition: border-color .2s, transform .15s, box-shadow .2s;
      text-align: center; text-decoration: none; display: block;
    }
    .mode-card:hover { border-color: rgba(130,160,204,0.45); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,0.35); }
    .mode-card-icon { font-size: 36px; display: block; margin-bottom: 14px; }
    .mode-card-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .mode-card-sub { font-size: 12px; color: var(--text-dim); line-height: 1.5; }
    .mode-logout { margin-top: 28px; background: none; border: none; font-size: 12px; color: var(--text-dim); cursor: pointer; font-family: inherit; }
    .mode-logout:hover { color: var(--text); }
    @media (max-width: 420px) { .mode-cards { grid-template-columns: 1fr; } }

    /* ── Login screen ── */
    #loginScreen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      background: radial-gradient(ellipse at 50% 30%, rgba(91,141,238,0.07) 0%, transparent 70%);
    }
    .login-card {
      background: var(--navy);
      border: 1px solid rgba(130,160,204,0.18);
      border-radius: 18px;
      padding: 48px 36px 40px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.3);
    }
    .login-card img { height: 52px; width: auto; margin-bottom: 28px; display: block; margin-left: auto; margin-right: auto; }
    .login-card h1 { font-size: 18px; font-weight: 700; margin-bottom: 8px; color: var(--text); }
    .login-card p  { font-size: 13px; color: var(--text-dim); margin-bottom: 36px; line-height: 1.5; }
    .login-btn {
      width: 100%;
      padding: 15px;
      background: var(--blue-btn);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 0.02em;
      box-shadow: 0 4px 16px rgba(91,141,238,0.4);
      transition: background 0.15s, transform 0.15s, box-shadow 0.15s;
    }
    .login-btn:hover { background: #4a7de0; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(91,141,238,0.5); }
    .login-btn:active { transform: translateY(0); }

    /* ── Admin screen ── */
    #adminScreen { display: none; padding: 76px 14px 88px; }

    .page-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 16px;
      padding: 0 2px;
    }

    /* ── Category folders ── */
    .folder {
      margin-bottom: 10px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: var(--card-shadow);
      transition: box-shadow 0.2s;
    }
    .folder:hover { box-shadow: var(--card-shadow-hover); }
    .folder-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      background: var(--navy);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: background 0.15s;
    }
    .folder-header:hover { background: rgba(12,45,58,0.85); }
    .folder-header:active { background: var(--navy-mid); }
    .folder-icon  { font-size: 18px; flex-shrink: 0; }
    .folder-name  { font-weight: 700; font-size: 14px; flex: 1; letter-spacing: 0.01em; }
    .folder-count {
      background: rgba(91,141,238,0.15);
      color: var(--blue-btn);
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 20px;
      min-width: 24px;
      text-align: center;
      border: 1px solid rgba(91,141,238,0.2);
    }
    .folder-empty { color: var(--text-dim); font-size: 11px; }
    .folder-chevron {
      color: rgba(130,160,204,0.45);
      font-size: 10px;
      transition: transform 0.22s cubic-bezier(.32,.72,0,1);
      flex-shrink: 0;
    }
    .folder.open .folder-header  { background: var(--navy-mid); }
    .folder.open .folder-chevron { transform: rotate(90deg); }

    .folder-body { display: none; background: rgba(10,30,43,0.9); }
    .folder.open .folder-body { display: block; }

    /* ── Photo grid ── */
    .photo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 12px 12px 8px;
    }
    .photo-card {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      background: var(--navy);
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      transition: transform 0.18s, box-shadow 0.18s;
    }
    .photo-card:hover { transform: scale(1.015); box-shadow: 0 4px 16px rgba(0,0,0,0.45); }
    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .photo-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.25) 0%, transparent 35%, transparent 65%, rgba(0,0,0,0.2) 100%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .photo-card:hover::after { opacity: 1; }
    .photo-delete {
      position: absolute;
      top: 6px; right: 6px;
      z-index: 3;
      width: 30px; height: 30px;
      background: rgba(200,60,60,0.9);
      border: none;
      border-radius: 50%;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      box-shadow: 0 2px 6px rgba(0,0,0,0.35);
      backdrop-filter: blur(4px);
      transition: background 0.15s, transform 0.12s;
    }
    .photo-delete:hover { background: rgba(224,70,70,1); transform: scale(1.08); }
    .photo-delete:active { background: #e07070; transform: scale(0.95); }

    .photo-move {
      position: absolute;
      top: 6px; left: 6px;
      z-index: 3;
      width: 30px; height: 30px;
      background: rgba(13,27,42,0.8);
      border: 1px solid rgba(130,160,204,0.4);
      border-radius: 50%;
      color: var(--blue);
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      backdrop-filter: blur(6px);
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      transition: background 0.15s, transform 0.12s, border-color 0.15s;
    }
    .photo-move:hover { background: rgba(91,141,238,0.25); border-color: rgba(91,141,238,0.6); transform: scale(1.08); }
    .photo-move:active { background: rgba(91,141,238,0.3); transform: scale(0.95); }

    /* ── Category sheet ── */
    .cat-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 9000;
      backdrop-filter: blur(2px);
    }
    .cat-overlay.show { display: block; }
    .cat-sheet {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 9001;
      background: #0e2f3e;
      border-top: 1px solid rgba(130,160,204,0.2);
      border-radius: 20px 20px 0 0;
      padding: 0 0 env(safe-area-inset-bottom, 16px);
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(.32,.72,0,1);
      box-shadow: 0 -8px 40px rgba(0,0,0,0.5);
    }
    .cat-sheet.show { transform: translateY(0); }
    .cat-sheet-handle {
      width: 40px; height: 4px;
      background: rgba(130,160,204,0.25);
      border-radius: 2px;
      margin: 12px auto 16px;
    }
    .cat-sheet-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-dim);
      padding: 0 18px 12px;
    }
    .cat-option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      cursor: pointer;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      border-top: 1px solid var(--border);
      transition: background 0.12s;
    }
    .cat-option:active { background: rgba(130,160,204,0.08); }
    .cat-option-icon  { font-size: 18px; flex-shrink: 0; }
    .cat-option-check { margin-left: auto; color: var(--blue-btn); font-size: 16px; }

    /* ── Add photo button ── */
    .add-row { padding: 8px 12px 14px; }
    .add-btn {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      background: rgba(91,141,238,0.07);
      border: 2px dashed rgba(91,141,238,0.3);
      color: rgba(91,141,238,0.8);
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .add-btn:hover  { background: rgba(91,141,238,0.13); border-color: rgba(91,141,238,0.55); color: var(--blue-btn); }
    .add-btn:active { background: rgba(91,141,238,0.2); }
    .add-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Warning tip bar ── */
    .tip-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 900;
      background: linear-gradient(90deg, #1a0c0c 0%, #2a1010 100%);
      border-top: 2px solid var(--red);
      padding: 10px 48px 10px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      line-height: 1.45;
      transition: transform 0.3s ease;
    }
    .tip-bar.hidden { transform: translateY(100%); pointer-events: none; }
    .tip-bar strong { color: var(--red); }
    .tip-bar em     { color: var(--blue); font-style: normal; font-weight: 600; }
    .tip-close {
      position: absolute;
      right: 10px; top: 50%;
      transform: translateY(-50%);
      width: 28px; height: 28px;
      background: rgba(224,112,112,0.15);
      border: 1px solid rgba(224,112,112,0.3);
      color: var(--red);
      font-size: 13px;
      border-radius: 6px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── Toast ── */
    #toast {
      position: fixed;
      top: 72px; left: 50%;
      transform: translateX(-50%) translateY(-12px);
      z-index: 9999;
      background: rgba(12,45,58,0.97);
      border: 1px solid rgba(130,160,204,0.25);
      border-radius: 10px;
      padding: 11px 20px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      backdrop-filter: blur(8px);
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    #toast.ok  { color: #6ee7b7; border-color: rgba(110,231,183,0.3); }
    #toast.err { color: var(--red); border-color: rgba(224,112,112,0.3); }

    /* ── Loading overlay ── */
    #loadingOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(13,27,42,0.8);
      backdrop-filter: blur(4px);
      z-index: 8000;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      font-size: 14px;
      color: var(--blue);
    }
    #loadingOverlay.show { display: flex; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(130,160,204,0.15);
      border-top-color: var(--blue-btn);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 480px) {
      .topbar-label  { display: none; }
      .topbar-divider { display: none; }
    }

    /* ── Tab bar ── */
    .tab-bar {
      display: flex;
      gap: 3px;
      margin-bottom: 18px;
      background: rgba(130,160,204,0.07);
      border-radius: 10px;
      padding: 4px;
      border: 1px solid rgba(130,160,204,0.1);
    }
    .tab-btn {
      flex: 1;
      padding: 9px 8px;
      border: none;
      border-radius: 7px;
      background: none;
      color: var(--text-dim);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      display: block;
      letter-spacing: 0.01em;
      transition: background 0.15s, color 0.15s, box-shadow 0.15s;
    }
    .tab-btn.active {
      background: var(--navy);
      color: var(--text);
      box-shadow: 0 1px 4px rgba(0,0,0,0.3), inset 0 0 0 1px rgba(130,160,204,0.12);
    }
    .tab-btn:not(.active):hover {
      background: rgba(130,160,204,0.07);
      color: rgba(255,255,255,0.65);
    }
    .back-btn {
      display: inline-flex; align-items: center; gap: 4px;
      background: none; border: none; color: var(--text-dim);
      font-size: 12px; font-family: inherit; cursor: pointer;
      padding: 4px 2px; margin-bottom: 6px; opacity: 0.65;
      text-decoration: none; letter-spacing: 0.02em;
    }
    .back-btn:hover { opacity: 1; color: var(--text); }

    /* ── Ticket cards ── */
    .ticket-card {
      background: var(--navy);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 16px 14px;
      margin-bottom: 10px;
      box-shadow: var(--card-shadow);
      transition: box-shadow 0.2s;
    }
    .ticket-card:hover { box-shadow: var(--card-shadow-hover); }
    .ticket-header {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 12px;
    }
    .ticket-name {
      font-weight: 700;
      font-size: 16px;
      flex: 1;
      letter-spacing: -0.01em;
      color: #fff;
    }
    .ticket-service {
      background: rgba(91,141,238,0.15);
      color: var(--blue-btn);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 20px;
      white-space: nowrap;
      border: 1px solid rgba(91,141,238,0.25);
      flex-shrink: 0;
    }
    .ticket-date {
      font-size: 10px;
      color: var(--text-dim);
      margin-bottom: 10px;
      letter-spacing: 0.03em;
    }
    .ticket-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 6px;
      line-height: 1.4;
    }
    .ticket-row a { color: var(--blue); text-decoration: none; }
    .ticket-row a:hover { text-decoration: underline; }
    .ticket-row strong { color: rgba(255,255,255,0.75); font-weight: 400; }
    .ticket-msg {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(130,160,204,0.05);
      border: 1px solid rgba(130,160,204,0.1);
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      line-height: 1.6;
      font-style: italic;
    }
    .tickets-empty {
      text-align: center;
      color: var(--text-dim);
      font-size: 14px;
      padding: 60px 0;
    }
    .tickets-count {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 14px;
      padding: 0 2px;
      font-weight: 600;
    }
    .ticket-review-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 14px;
      padding: 11px 16px;
      width: 100%;
      background: rgba(52,199,89,0.1);
      color: #4cd964;
      border: 1px solid rgba(52,199,89,0.28);
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      text-decoration: none;
      cursor: pointer;
      letter-spacing: 0.01em;
      transition: background 0.15s, border-color 0.15s, transform 0.12s, box-shadow 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .ticket-review-btn:hover {
      background: rgba(52,199,89,0.18);
      border-color: rgba(52,199,89,0.5);
      transform: translateY(-1px);
      box-shadow: 0 3px 12px rgba(52,199,89,0.2);
    }
    .ticket-review-btn:active {
      background: rgba(52,199,89,0.22);
      transform: translateY(0);
    }
    .ticket-review-btn:disabled {
      opacity: 0.45;
      cursor: default;
      transform: none;
      box-shadow: none;
    }
    .ticket-review-btn.sent {
      background: rgba(52,199,89,0.2);
      border-color: rgba(52,199,89,0.5);
      color: #4cd964;
    }
  </style>
</head>
<body>

<!-- Login screen -->
<div id="loginScreen">
  <div class="login-card">
    <img src="/uploads/logo.png" alt="Ravelo AV Tech" />
    <h1>Content Manager</h1>
    <p>Sign in to manage your site photos.</p>
    <button class="login-btn" id="loginBtn">Iniciar sesión</button>

    <p class="mode-greeting" id="modeGreeting">What would you like to open?</p>
    <div class="mode-cards" id="modeCards">
      <button class="mode-card" id="modeGallery">

        <div class="mode-card-sub">Gallery, estimates &amp; site content</div>
      </button>
      <a class="mode-card" href="/admin/walkthrough.html">
        <span class="mode-card-icon">🏠</span>
        <div class="mode-card-title">Site Walkthrough</div>

</div>

<!-- Admin screen -->
<div id="adminScreen">

  <!-- Top bar -->
  <div class="topbar">
    <a class="topbar-logo" href="/" target="_blank">
      <img src="/uploads/logo.png" alt="Ravelo AV Tech" width="110" height="34" />
    </a>
    <div class="topbar-divider"></div>
    <span class="topbar-label">Content Manager</span>
    <div class="topbar-badge">Admin</div>
    <button class="topbar-publish" id="publishBtn" disabled>Publish</button>
    <button class="topbar-logout" id="logoutBtn">Salir</button>
  </div>

  <!-- Back to mode selector -->
  <button class="back-btn" id="backToMode">← Back</button>

  <!-- Tab bar -->
  <div class="tab-bar">
    <button class="tab-btn active" id="tabGallery">🖼 Gallery</button>
    <a class="tab-btn restricted-tab" href="/admin/estimates.html">📋 Estimates</a>
    <button class="tab-btn restricted-tab" id="tabTickets">🎫 Tickets</button>
  </div>

  <!-- Gallery view -->
  <div id="viewGallery">
    <p class="page-title">Our Work — Gallery</p>
    <div id="foldersContainer"></div>
  </div>

  <!-- Tickets view -->
  <div id="viewTickets" style="display:none;">
    <p class="page-title">Quote Requests</p>
    <div id="ticketsCount" class="tickets-count"></div>

</div>

<!-- Warning tip -->
<div class="tip-bar" id="tipBar">
  <span>⚠️</span>

    <strong>✕</strong> removes · <strong>⇄</strong> changes category · <em>+ Add photo</em> uploads a new image.
  </span>
  <button class="tip-close" id="tipClose" aria-label="Cerrar aviso">✕</button>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Loading overlay -->
<div id="loadingOverlay">
  <div class="spinner"></div>
  <span id="loadingMsg">Saving…</span>
</div>

<!-- Category picker sheet -->
<div class="cat-overlay" id="catOverlay"></div>
<div class="cat-sheet" id="catSheet">
  <div class="cat-sheet-handle"></div>
  <div class="cat-sheet-title">Move to category</div>
  <div id="catOptions"></div>
</div>

<!-- Hidden file input -->
<input type="file" id="fileInput" accept="image/*" multiple style="display:none;" />

<script>
(function () {
  'use strict';

  const GIT_API = '/.netlify/git/github';

  const CATEGORIES = [
    { key: 'av',         label: 'Home Theater', icon: '🎬' },
    { key: 'security',   label: 'Security',      icon: '📷' },
    { key: 'network',    label: 'Networks',      icon: '🌐' },
    { key: 'smart',      label: 'Smart Home',    icon: '🏠' },
    { key: 'wiring',     label: 'Wiring',        icon: '🔌' },
    { key: 'lowvoltage', label: 'Low Voltage',   icon: '⚡' },
    { key: 'lutron',     label: 'Lutron',        icon: '💡' },
  ];

  var gallery = [];          // [{ url, category }]
  var pendingCategory = null;
  var pendingMove = null;    // { url, fromCat }
  var isDirty = false;
  var blobCache = {};        // url → local blob data URL (while Netlify deploys)

  // ── Elements ──────────────────────────────────────────────────────────────
  var loginScreen   = document.getElementById('loginScreen');
  var adminScreen   = document.getElementById('adminScreen');
  var loginBtn      = document.getElementById('loginBtn');
  var logoutBtn     = document.getElementById('logoutBtn');
  var foldersEl     = document.getElementById('foldersContainer');
  var fileInput     = document.getElementById('fileInput');
  var toastEl       = document.getElementById('toast');
  var loadingEl     = document.getElementById('loadingOverlay');
  var loadingMsgEl  = document.getElementById('loadingMsg');
  var tipBar        = document.getElementById('tipBar');
  var tipClose      = document.getElementById('tipClose');
  var catOverlay    = document.getElementById('catOverlay');
  var catSheet      = document.getElementById('catSheet');
  var catOptionsEl  = document.getElementById('catOptions');
  var publishBtn    = document.getElementById('publishBtn');

  // ── Tip bar ───────────────────────────────────────────────────────────────
  if (sessionStorage.getItem('tipDismissed')) tipBar.classList.add('hidden');
  tipClose.addEventListener('click', function () {
    tipBar.classList.add('hidden');
    sessionStorage.setItem('tipDismissed', '1');
  });

  // ── Dirty state / Publish ─────────────────────────────────────────────────
  function markDirty() {
    isDirty = true;
    publishBtn.classList.add('dirty');
    publishBtn.disabled = false;
  }
  function markClean() {
    isDirty = false;
    publishBtn.classList.remove('dirty');
    publishBtn.disabled = true;
  }

  publishBtn.addEventListener('click', function () {
    if (!isDirty) return;
    saveGallery().then(function () {
      markClean();
    }).catch(function () {});
  });

  // ── Toast ─────────────────────────────────────────────────────────────────
  var toastTimer;
  function showToast(msg, type) {
    clearTimeout(toastTimer);
    toastEl.textContent = msg;
    toastEl.className = 'show ' + (type || 'ok');
    toastTimer = setTimeout(function () { toastEl.className = ''; }, 3000);
  }

  // ── Loading ───────────────────────────────────────────────────────────────
  function setLoading(msg) {
    if (msg) {
      loadingMsgEl.textContent = msg;
      loadingEl.classList.add('show');
    } else {
      loadingEl.classList.remove('show');
    }
  }

  // ── Auth ──────────────────────────────────────────────────────────────────
  function getToken() {
    var user = netlifyIdentity.currentUser();
    if (!user) return Promise.reject(new Error('Not logged in'));
    return user.jwt();
  }

  var modeScreen    = document.getElementById('modeScreen');
  var RESTRICTED_USERS = ['gaven.certeza@raveloavtech.com'];

  function showLogin() {
    loginScreen.style.display = 'flex';
    modeScreen.style.display  = 'none';
    adminScreen.style.display = 'none';
  }
  function showMode() {
    var user = netlifyIdentity.currentUser();
    loginScreen.style.display = 'none';
    adminScreen.style.display = 'none';
    modeScreen.style.display  = 'flex';
    var isRestricted = user && RESTRICTED_USERS.indexOf(user.email) !== -1;
    document.querySelector('#modeGallery .mode-card-sub').textContent =
      isRestricted ? 'Gallery & site content' : 'Gallery, estimates & site content';
    document.getElementById('modeGreeting').textContent =
      'Hi' + (user && user.user_metadata && user.user_metadata.full_name ? ' ' + user.user_metadata.full_name.split(' ')[0] : '') + ' — what would you like to open?';
  }
  function showAdmin() {
    loginScreen.style.display = 'none';
    modeScreen.style.display  = 'none';
    adminScreen.style.display = 'block';
    var user = netlifyIdentity.currentUser();
    var isRestricted = user && RESTRICTED_USERS.indexOf(user.email) !== -1;
    document.querySelectorAll('.restricted-tab').forEach(function (el) {
      el.style.display = isRestricted ? 'none' : '';
    });
    if (!isRestricted && new URLSearchParams(window.location.search).get('view') === 'tickets') {
      document.getElementById('tabTickets').click();
    }
  }

  document.getElementById('modeGallery').addEventListener('click', function () {
    showAdmin();
    loadGallery();
    if (new URLSearchParams(window.location.search).get('view') === 'tickets') tabTickets.click();
  });
  document.getElementById('modeLogout').addEventListener('click', function () { netlifyIdentity.logout(); });
  document.getElementById('backToMode').addEventListener('click', showMode);

  loginBtn.addEventListener('click', function () { netlifyIdentity.open(); });
  logoutBtn.addEventListener('click', function () { netlifyIdentity.logout(); });

  netlifyIdentity.on('login', function () { netlifyIdentity.close(); showMode(); });
  netlifyIdentity.on('logout', function () { showLogin(); });
  netlifyIdentity.on('init', function (user) {
    if (user) showMode();
    else showLogin();
  });

  // ── Git Gateway API ───────────────────────────────────────────────────────
  function gitGet(path) {
    return getToken().then(function (token) {
      return fetch(GIT_API + path, {
        headers: { 'Authorization': 'Bearer ' + token }
      }).then(function (r) {
        if (!r.ok) throw new Error('GET ' + path + ' failed: ' + r.status);
        return r.json();
      });
    });
  }

  function gitPut(path, body) {
    return getToken().then(function (token) {
      return fetch(GIT_API + path, {
        method: 'PUT',
        headers: {
          'Authorization': 'Bearer ' + token,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
      }).then(function (r) {
        if (!r.ok) return r.text().then(function (t) { throw new Error(t); });
        return r.json();
      });
    });
  }

  // ── Load gallery ──────────────────────────────────────────────────────────
  function loadGallery() {
    setLoading('Loading gallery…');
    gitGet('/contents/images.json').then(function (data) {
      var content = JSON.parse(decodeURIComponent(
        escape(atob(data.content.replace(/\n/g, '')))
      ));
      gallery = content.gallery || [];
      setLoading(null);
      renderFolders();
    }).catch(function (err) {
      setLoading(null);
      showToast('Error loading gallery', 'err');
      console.error(err);
    });
  }

  // ── Save gallery ──────────────────────────────────────────────────────────
  var CAT_LABELS = {
    av: 'Home Theater', network: 'Networks', security: 'Security',
    smart: 'Smart Home', wiring: 'Wiring', lowvoltage: 'Low Voltage', lutron: 'Lutron'
  };

  function saveGallery() {
    setLoading('Saving…');

    // Step 1 — Save images.json (critical)
    return gitGet('/contents/images.json').then(function (data) {
      var encoded = btoa(unescape(encodeURIComponent(
        JSON.stringify({ gallery: gallery }, null, 2)
      )));
      return gitPut('/contents/images.json', {
        message: 'Update gallery photos',
        content: encoded,
        sha: data.sha
      });

    // Step 2 — Sync hardcoded fallback in index.html (non-fatal)
    }).then(function () {
      return gitGet('/contents/index.html').then(function (data) {
        // Robust UTF-8 decode
        var raw  = atob(data.content.replace(/\n/g, ''));
        var html = decodeURIComponent(
          raw.split('').map(function (c) {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
          }).join('')
        );

        var newItems = gallery.map(function (item) {
          var label = CAT_LABELS[item.category] || item.category;
          // Escape $ to avoid replacement string special chars
          return ('    <div class="gal-item" data-category="' + item.category + '">' +
            '<img loading="lazy" decoding="async" src="' + item.url + '" alt="' + label + '" />' +
            '<div class="gal-overlay"><span>' + label + '</span></div>' +
            '</div>').replace(/\$/g, '$$$$');
        }).join('\n');

        var updated = html.replace(
          /(<div id="gallery-container">)([\s\S]*?)(<\/div>)(\s*\n\s*<!-- Gallery grid -->)/,
          '$1\n' + newItems + '\n  $3$4'
        );

        if (updated === html) return; // regex didn't match, skip

        var encoded = btoa(unescape(encodeURIComponent(updated)));
        return gitPut('/contents/index.html', {
          message: 'Sync gallery fallback with images.json',
          content: encoded,
          sha: data.sha
        });
      }).catch(function (err) {
        // index.html update failing is not critical — images.json is already saved
        console.warn('index.html sync failed (non-fatal):', err);
      });

    }).then(function () {
      setLoading(null);
      showToast('✓ Published — site is updating', 'ok');
    }).catch(function (err) {
      setLoading(null);
      showToast('Error publishing', 'err');
      console.error(err);
      throw err;
    });
  }

  // ── Upload image ──────────────────────────────────────────────────────────
  function resizeImage(file, maxW) {
    maxW = maxW || 1400;
    return new Promise(function (resolve) {
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function () {
        URL.revokeObjectURL(url);
        var ratio = Math.min(1, maxW / img.width);
        var w = Math.round(img.width * ratio);
        var h = Math.round(img.height * ratio);
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(function (blob) {
          if (!blob) { reject(new Error('Could not convert image')); return; }
          resolve(blob);
        }, 'image/jpeg', 0.85);
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error('Could not read image'));
      };
      img.src = url;
    });
  }

  function uploadImage(file, category) {
    return resizeImage(file).then(function (blob) {
      return new Promise(function (resolve, reject) {
        var reader = new FileReader();
        reader.onload = function () {
          var dataUrl = reader.result;
          var b64 = dataUrl.split(',')[1];
          var ts  = Date.now();
          var filename = 'gallery-' + category + '-' + ts + '.jpg';
          var finalUrl = '/uploads/' + filename;
          gitPut('/contents/uploads/' + filename, {
            message: 'Add gallery photo: ' + filename,
            content: b64
          }).then(function () {
            // Cache blob locally so the admin shows it before Netlify redeploys
            blobCache[finalUrl] = dataUrl;
            resolve(finalUrl);
          }).catch(reject);
        };
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    });
  }

  // ── File input handler ────────────────────────────────────────────────────
  fileInput.addEventListener('change', function () {
    var files = Array.from(fileInput.files);
    fileInput.value = '';
    if (!files.length || !pendingCategory) return;

    var cat = pendingCategory;
    pendingCategory = null;

    // Validate all files first
    for (var i = 0; i < files.length; i++) {
      if (!files[i].type.startsWith('image/')) {
        showToast('"' + files[i].name + '" is not a valid image', 'err');
        return;
      }
      if (files[i].size > 30 * 1024 * 1024) {
        showToast('"' + files[i].name + '" es demasiado grande (máx 30 MB)', 'err');
        return;
      }
    }

    var total = files.length;
    var done = 0;
    var failed = 0;

    function uploadNext(idx) {
      if (idx >= total) {
        setLoading(null);
        renderFolders();
        markDirty();
        var msg = (total - failed) + ' photo' + (total - failed !== 1 ? 's' : '') + ' added';
        if (failed > 0) msg += ' (' + failed + ' failed)';
        showToast('✓ ' + msg + ' — tap Publish to save', failed ? 'err' : 'ok');
        return;
      }
      setLoading('Subiendo ' + (idx + 1) + ' de ' + total + '…');
      uploadImage(files[idx], cat).then(function (url) {
        gallery.push({ url: url, category: cat });
        done++;
        uploadNext(idx + 1);
      }).catch(function (err) {
        failed++;
        console.error(err);
        uploadNext(idx + 1);
      });
    }

    uploadNext(0);
  });

  // ── Category sheet ────────────────────────────────────────────────────────
  function openCatSheet(url, fromCat) {
    pendingMove = { url: url, fromCat: fromCat };

    catOptionsEl.innerHTML = '';
    CATEGORIES.forEach(function (cat) {
      var btn = document.createElement('button');
      btn.className = 'cat-option';
      btn.innerHTML =
        '<span class="cat-option-icon">' + cat.icon + '</span>' +
        '<span>' + cat.label + '</span>' +
        (cat.key === fromCat ? '<span class="cat-option-check">✓</span>' : '');
      btn.addEventListener('click', function () {
        closeCatSheet();
        if (cat.key !== fromCat) movePhoto(url, fromCat, cat.key);
      });
      catOptionsEl.appendChild(btn);
    });

    catOverlay.classList.add('show');
    // next frame so transition plays
    requestAnimationFrame(function () { catSheet.classList.add('show'); });
  }

  function closeCatSheet() {
    catSheet.classList.remove('show');
    catOverlay.classList.remove('show');
    pendingMove = null;
  }

  catOverlay.addEventListener('click', closeCatSheet);

  function movePhoto(url, fromCat, toCat) {
    gallery = gallery.map(function (p) {
      if (p.url === url && p.category === fromCat) {
        return { url: p.url, category: toCat };
      }
      return p;
    });
    openFolders[toCat] = true;
    renderFolders();
    markDirty();
  }

  // ── Delete photo ──────────────────────────────────────────────────────────
  function deletePhoto(url, category) {
    if (!confirm('Delete this photo?')) return;
    gallery = gallery.filter(function (p) {
      return !(p.url === url && p.category === category);
    });
    renderFolders();
    markDirty();
  }

  // ── Render folders ────────────────────────────────────────────────────────
  var openFolders = {};

  function renderFolders() {
    // Remember which folders are open
    foldersEl.querySelectorAll('.folder.open').forEach(function (el) {
      openFolders[el.dataset.cat] = true;
    });

    foldersEl.innerHTML = '';

    CATEGORIES.forEach(function (cat) {
      var photos = gallery.filter(function (p) { return p.category === cat.key; });
      var count  = photos.length;
      var isOpen = openFolders[cat.key] !== undefined
        ? openFolders[cat.key]
        : false;

      var folder = document.createElement('div');
      folder.className = 'folder' + (isOpen ? ' open' : '');
      folder.dataset.cat = cat.key;

      // Header
      var header = document.createElement('div');
      header.className = 'folder-header';
      header.innerHTML =
        '<span class="folder-icon">' + cat.icon + '</span>' +
        '<span class="folder-name">' + cat.label + '</span>' +
        (count > 0
          ? '<span class="folder-count">' + count + '</span>'
          : '<span class="folder-empty">vacío</span>') +
        '<span class="folder-chevron">▶</span>';
      header.addEventListener('click', function () {
        var wasOpen = folder.classList.contains('open');
        folder.classList.toggle('open');
        openFolders[cat.key] = !wasOpen;
      });
      folder.appendChild(header);

      // Body
      var body = document.createElement('div');
      body.className = 'folder-body';

      // Photo grid
      if (count > 0) {
        var grid = document.createElement('div');
        grid.className = 'photo-grid';
        photos.forEach(function (photo) {
          var card = document.createElement('div');
          card.className = 'photo-card';

          var img = document.createElement('img');
          img.src = blobCache[photo.url] || photo.url;
          img.alt = cat.label;
          img.loading = 'lazy';
          img.onerror = function () {
            img.style.display = 'none';
            var ph = document.createElement('div');
            ph.style.cssText = 'position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:rgba(224,112,112,0.7);font-size:11px;text-align:center;padding:8px;pointer-events:none;';
            ph.innerHTML = '<span style="font-size:22px;">⚠️</span><span>Image not found</span>';
            card.appendChild(ph);
          };
          card.appendChild(img);

          var move = document.createElement('button');
          move.className = 'photo-move';
          move.textContent = '⇄';
          move.setAttribute('aria-label', 'Change category');
          move.addEventListener('click', function (e) {
            e.stopPropagation();
            openCatSheet(photo.url, photo.category);
          });
          card.appendChild(move);

          var del = document.createElement('button');
          del.className = 'photo-delete';
          del.textContent = '✕';
          del.setAttribute('aria-label', 'Delete photo');
          del.addEventListener('click', function (e) {
            e.stopPropagation();
            deletePhoto(photo.url, photo.category);
          });
          card.appendChild(del);

          grid.appendChild(card);
        });
        body.appendChild(grid);
      }

      // Add button
      var addRow = document.createElement('div');
      addRow.className = 'add-row';
      var addBtn = document.createElement('button');
      addBtn.className = 'add-btn';
      addBtn.textContent = '+ Add photo';
      addBtn.addEventListener('click', function () {
        pendingCategory = cat.key;
        fileInput.click();
      });
      addRow.appendChild(addBtn);
      body.appendChild(addRow);

      folder.appendChild(body);
      foldersEl.appendChild(folder);
    });
  }

  // ── Tabs ──────────────────────────────────────────────────────────────────
  var tabGallery    = document.getElementById('tabGallery');
  var tabTickets    = document.getElementById('tabTickets');
  var viewGallery   = document.getElementById('viewGallery');
  var viewTickets   = document.getElementById('viewTickets');
  var ticketsEl     = document.getElementById('ticketsContainer');
  var ticketsCount  = document.getElementById('ticketsCount');
  var ticketsLoaded = false;

  tabGallery.addEventListener('click', function () {
    tabGallery.classList.add('active');
    tabTickets.classList.remove('active');
    viewGallery.style.display = 'block';
    viewTickets.style.display = 'none';
  });

  tabTickets.addEventListener('click', function () {
    tabTickets.classList.add('active');
    tabGallery.classList.remove('active');
    viewGallery.style.display = 'none';
    viewTickets.style.display = 'block';
    if (!ticketsLoaded) loadTickets();
  });

  // ── Load tickets ──────────────────────────────────────────────────────────
  function loadTickets() {
    ticketsLoaded = true;
    ticketsEl.innerHTML = '<div class="tickets-empty">Loading tickets…</div>';

    getToken().then(function (token) {
      return fetch('/.netlify/functions/get-tickets', {
        headers: { 'Authorization': 'Bearer ' + token }
      });
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (tickets) {
      if (!tickets.length) {
        ticketsCount.textContent = '';
        ticketsEl.innerHTML = '<div class="tickets-empty">📭 No quote requests yet</div>';
        return;
      }
      ticketsCount.textContent = tickets.length + ' quote request' + (tickets.length !== 1 ? 's' : '') + ' received';
      ticketsEl.innerHTML = '';
      tickets.forEach(function (t) {
        var date = new Date(t.created_at).toLocaleString('en-US', {
          month: 'short', day: 'numeric', year: 'numeric',
          hour: 'numeric', minute: '2-digit', hour12: true
        });
        var card = document.createElement('div');
        card.className = 'ticket-card';
        card.innerHTML =
          '<div class="ticket-header">' +
            '<span class="ticket-name">' + esc(t.name || 'Unknown') + '</span>' +
            (t.service ? '<span class="ticket-service">' + esc(t.service) + '</span>' : '') +
          '</div>' +
          '<div class="ticket-date">📅 ' + date + '</div>' +
          (t.email   ? '<div class="ticket-row">✉️ <a href="mailto:' + esc(t.email) + '">' + esc(t.email) + '</a></div>' : '') +
          (t.phone   ? '<div class="ticket-row">📞 <a href="tel:' + esc(t.phone.replace(/\D/g,'')) + '">' + esc(t.phone) + '</a></div>' : '') +
          (t.address ? '<div class="ticket-row">📍 <strong>' + esc(t.address) + '</strong></div>' : '') +
          (t.message ? '<div class="ticket-msg">"' + esc(t.message) + '"</div>' : '') +
          (t.email   ? '<button class="ticket-review-btn">⭐ Request Google Review</button>' : '');
        // Attach click handler via JS (avoids quote-escaping issues with inline onclick)
        if (t.email) {
          var reviewBtn = card.querySelector('.ticket-review-btn');
          reviewBtn.addEventListener('click', function () {
            sendReview(reviewBtn, t.name || '', t.email);
          });
        }
        ticketsEl.appendChild(card);
      });
    }).catch(function (err) {
      ticketsLoaded = false;
      ticketsEl.innerHTML = '<div class="tickets-empty">⚠️ Error loading tickets<br><small>' + err.message + '</small></div>';
      console.error(err);
    });
  }

  function esc(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  window.sendReview = function sendReview(btn, name, email) {
    if (btn.disabled) return;
    btn.disabled = true;
    btn.textContent = '⏳ Sending…';

    function showBanner(success, msg) {
      var banner = document.createElement('div');
      banner.style.cssText =
        'margin-top:12px;padding:10px 14px;border-radius:8px;' +
        'font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px;' +
        (success
          ? 'background:rgba(52,199,89,0.15);border:1px solid rgba(52,199,89,0.4);color:#4cd964;'
          : 'background:rgba(224,112,112,0.15);border:1px solid rgba(224,112,112,0.4);color:#e07070;');
      banner.innerHTML = '<span style="font-size:16px;">' + (success ? '✅' : '❌') + '</span><span>' + msg + '</span>';
      btn.replaceWith(banner);
    }

    getToken().then(function(token) {
      return fetch('/.netlify/functions/send-review', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token,
        },
        body: JSON.stringify({ name: name, email: email }),
      });
    }).then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function() {
      showBanner(true, 'Review request sent to <strong style="font-weight:700;">' + email + '</strong>');
    }).catch(function(err) {
      showBanner(false, 'Could not send — ' + err.message);
    });
  }

})();
</script>

</html>
