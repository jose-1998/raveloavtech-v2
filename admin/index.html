<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Content Manager — Ravelo AV Tech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&display=swap" /></noscript>
  <link rel="icon" type="image/png" href="/uploads/favicon.png" />
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #0c2d3a;
      --navy-light: #0d1b2a;
      --blue: #82A0CC;
      --blue-bright: #5b8dee;
      --red: #e07070;
      --text: rgba(255,255,255,0.85);
      --text-dim: rgba(255,255,255,0.45);
    }

    html, body { height: 100%; background: var(--navy-light); }

    /* ── Branded top bar — matches main site nav ── */
    .rav-topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100000;
      height: 64px;
      background: var(--navy);
      border-bottom: 1px solid rgba(130,160,204,0.1);
      display: flex;
      align-items: center;
      padding: 0 28px;
      gap: 16px;
    }
    .rav-topbar-logo {
      display: flex;
      align-items: center;
      text-decoration: none;
      flex-shrink: 0;
    }
    .rav-topbar-logo img {
      height: 38px;
      width: auto;
      display: block;
    }
    .rav-topbar-divider {
      width: 1px;
      height: 22px;
      background: rgba(130,160,204,0.2);
    }
    .rav-topbar-title {
      font-family: 'Figtree', sans-serif;
      font-size: 12px;
      font-weight: 400;
      color: var(--blue);
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .rav-topbar-badge {
      margin-left: auto;
      background: rgba(130,160,204,0.1);
      border: 1px solid rgba(130,160,204,0.2);
      color: var(--blue);
      font-family: 'Figtree', sans-serif;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 3px;
    }
    @media (max-width: 480px) {
      .rav-topbar { padding: 0 16px; }
      .rav-topbar-title { display: none; }
      .rav-topbar-divider { display: none; }
    }

    /* ── Warning tip bar ── */
    .rav-tip {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 100000;
      background: linear-gradient(90deg, #1a0c0c 0%, #2a1010 100%);
      border-top: 2px solid var(--red);
      color: var(--text);
      font-family: sans-serif;
      font-size: 13px;
      line-height: 1.5;
      padding: 10px 48px 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 -4px 20px rgba(224,112,112,0.15);
      transition: transform 0.3s ease;
    }
    .rav-tip.hidden { transform: translateY(100%); pointer-events: none; }
    .rav-tip-icon { font-size: 16px; flex-shrink: 0; }
    .rav-tip-text { flex: 1; }
    .rav-tip strong { color: var(--red); }
    .rav-tip em { color: var(--blue); font-style: normal; font-weight: 600; }
    .rav-tip-close {
      position: absolute;
      right: 10px; top: 50%;
      transform: translateY(-50%);
      background: rgba(224,112,112,0.15);
      border: 1px solid rgba(224,112,112,0.3);
      color: var(--red);
      font-size: 14px;
      width: 30px; height: 30px;
      border-radius: 6px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .rav-tip-close:hover { background: rgba(224,112,112,0.25); }

    .rav-tip-reopen {
      position: fixed;
      bottom: 12px; left: 12px;
      z-index: 99999;
      background: var(--navy);
      border: 1px solid var(--red);
      color: var(--red);
      font-family: sans-serif;
      font-size: 11px;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      display: none;
      box-shadow: 0 2px 12px rgba(0,0,0,0.4);
    }
    .rav-tip-reopen.visible { display: block; }

    /* ── Push content below topbar and above tip ── */
    body.tip-open   { padding-top: 64px; padding-bottom: var(--tip-h, 56px); }
    body.tip-closed { padding-top: 64px; padding-bottom: 0; }

    /* ── Decap CMS global overrides ── */
    #nc-root, #root {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important;
    }

    /* Nav sidebar */
    [class*="Nav"],
    nav[class] {
      background: var(--navy) !important;
      border-right: 1px solid rgba(130,160,204,0.1) !important;
    }

    /* Top app header */
    header[class] {
      background: #0a2030 !important;
      border-bottom: 1px solid rgba(130,160,204,0.12) !important;
      box-shadow: none !important;
    }

    /* Primary buttons */
    button[class*="primary"],
    button[class*="Primary"],
    [class*="button"][class*="primary"] {
      background: var(--blue-bright) !important;
      border-color: var(--blue-bright) !important;
      border-radius: 6px !important;
    }
    button[class*="primary"]:hover,
    button[class*="Primary"]:hover {
      background: #4a7de0 !important;
    }

    /* All CMS buttons — rounded */
    button[class] {
      border-radius: 6px !important;
      min-height: 36px !important;
    }

    /* Input fields */
    input[class], textarea[class], select[class] {
      border-radius: 6px !important;
      border-color: rgba(130,160,204,0.25) !important;
    }
    input[class]:focus, textarea[class]:focus, select[class]:focus {
      border-color: var(--blue-bright) !important;
      outline: none !important;
      box-shadow: 0 0 0 3px rgba(91,141,238,0.15) !important;
    }

    /* Cards / panels */
    [class*="Card"], [class*="card"] {
      border-radius: 8px !important;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12) !important;
    }

    /* Media library modal */
    @media (max-width: 900px) {
      div[role="dialog"],
      [class*="MediaLibrary"] [class*="Overlay"] {
        position: fixed !important;
        inset: 0 !important;
        width: 100vw !important;
        height: 100dvh !important;
        max-width: 100vw !important;
        max-height: 100dvh !important;
        margin: 0 !important;
        border-radius: 0 !important;
        overflow-y: auto !important;
        -webkit-overflow-scrolling: touch !important;
      }

      div[role="dialog"] > div,
      [class*="MediaLibrary"] > div {
        width: 100% !important;
        max-width: 100% !important;
        min-height: 100% !important;
        border-radius: 0 !important;
      }

      /* Close button — make sure it's visible */
      div[role="dialog"] button[aria-label*="close"],
      div[role="dialog"] button[aria-label*="Close"],
      div[role="dialog"] button[title*="close"],
      [class*="CloseButton"],
      [class*="close-button"] {
        position: fixed !important;
        top: 12px !important;
        right: 12px !important;
        z-index: 999999 !important;
        width: 44px !important;
        height: 44px !important;
        min-width: 44px !important;
        background: rgba(255,255,255,0.1) !important;
        border-radius: 50% !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        font-size: 18px !important;
      }

      /* Header button row wraps */
      div[role="dialog"] header,
      [class*="MediaLibrary"] header {
        display: flex !important;
        flex-wrap: wrap !important;
        gap: 6px !important;
        padding: 12px !important;
        position: sticky !important;
        top: 0 !important;
        background: inherit !important;
        z-index: 10 !important;
      }

      div[role="dialog"] header button,
      [class*="MediaLibrary"] header button {
        flex: 1 1 auto !important;
        min-width: 80px !important;
        min-height: 44px !important;
        font-size: 13px !important;
        padding: 10px 8px !important;
      }

      /* Search input */
      div[role="dialog"] input,
      [class*="MediaLibrary"] input {
        width: 100% !important;
        min-height: 44px !important;
        font-size: 16px !important;
        box-sizing: border-box !important;
      }

      /* 2-column image grid */
      div[role="dialog"] ul,
      [class*="MediaLibrary"] ul,
      [class*="MediaLibrary"] [class*="Grid"] {
        display: grid !important;
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 8px !important;
        padding: 8px !important;
        width: 100% !important;
      }

      div[role="dialog"] li,
      [class*="MediaLibrary"] li {
        width: 100% !important;
        max-width: 100% !important;
      }
    }

    /* ── General mobile CMS overrides ── */
    @media (max-width: 900px) {
      header[class] button,
      header[class] a {
        min-height: 44px !important;
        min-width: 44px !important;
        font-size: 13px !important;
        padding: 8px 14px !important;
        white-space: nowrap !important;
      }

      #root, #nc-root, [id^="cms-"] {
        overflow-x: auto !important;
        width: 100% !important;
      }

      select, input, textarea {
        min-height: 44px !important;
        font-size: 16px !important;
      }

      [class*="ListControl"] button,
      [class*="list-control"] button {
        min-height: 44px !important;
        padding: 10px 16px !important;
      }

      [class*="ListItem"],
      [class*="list-item"] {
        width: 100% !important;
        max-width: 100% !important;
      }
    }
  </style>
</head>
<body class="tip-open">

  <!-- Branded top bar -->
  <div class="rav-topbar">
    <a class="rav-topbar-logo" href="/" target="_blank">
      <img src="/uploads/logo.png" alt="Ravelo AV Tech" width="124" height="38" />
    </a>
    <div class="rav-topbar-divider"></div>
    <div class="rav-topbar-title">Content Manager</div>
    <div class="rav-topbar-badge">Admin</div>
  </div>

  <!-- Warning tip -->
  <div class="rav-tip" id="ravTip">
    <span class="rav-tip-icon">⚠️</span>
    <span class="rav-tip-text">
      <strong>Para cambiar una foto:</strong>
      usa 🗑 <em>eliminar</em> en esa entrada y agrega una <em>nueva</em> —
      <strong>NO uses "Choose an image" en entradas existentes.</strong>
    </span>
    <button class="rav-tip-close" id="ravClose" aria-label="Cerrar aviso">✕</button>
  </div>

  <button class="rav-tip-reopen" id="ravReopen">⚠️ Ver aviso</button>

  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    (function () {
      var tip      = document.getElementById('ravTip');
      var closeBtn = document.getElementById('ravClose');
      var reopen   = document.getElementById('ravReopen');
      var body     = document.body;

      function setTipHeight() {
        var h = tip.offsetHeight;
        document.documentElement.style.setProperty('--tip-h', h + 'px');
      }
      setTipHeight();
      window.addEventListener('resize', setTipHeight);

      if (sessionStorage.getItem('ravTipDismissed')) {
        tip.classList.add('hidden');
        reopen.classList.add('visible');
        body.classList.replace('tip-open', 'tip-closed');
      }

      closeBtn.addEventListener('click', function () {
        tip.classList.add('hidden');
        reopen.classList.add('visible');
        body.classList.replace('tip-open', 'tip-closed');
        sessionStorage.setItem('ravTipDismissed', '1');
      });

      reopen.addEventListener('click', function () {
        tip.classList.remove('hidden');
        reopen.classList.remove('visible');
        body.classList.replace('tip-closed', 'tip-open');
        sessionStorage.removeItem('ravTipDismissed');
        setTipHeight();
      });
    })();

    // Mobile toolbar overflow fix — runs every 600ms for 20s after mount
    if (window.innerWidth <= 900) {
      function fixCmsOverflow() {
        document.querySelectorAll('header, nav, [role="toolbar"]').forEach(function(el) {
          el.style.overflowX = 'auto';
          el.style.webkitOverflowScrolling = 'touch';
          var node = el;
          for (var i = 0; i < 8; i++) {
            node = node.parentElement;
            if (!node || node === document.documentElement) break;
            var cs = window.getComputedStyle(node);
            if (cs.overflow === 'hidden' || cs.overflowX === 'hidden') {
              node.style.overflowX = 'auto';
            }
          }
        });
        document.querySelectorAll('div').forEach(function(div) {
          var btns = div.querySelectorAll(':scope > button, :scope > a');
          if (btns.length >= 2) {
            div.style.overflowX = 'auto';
            div.style.webkitOverflowScrolling = 'touch';
            div.style.flexShrink = '0';
          }
        });
      }

      var attempts = 0;
      var iv = setInterval(function() {
        fixCmsOverflow();
        if (++attempts >= 34) clearInterval(iv);
      }, 600);

      window.addEventListener('hashchange', function() {
        attempts = 0;
        clearInterval(iv);
        iv = setInterval(function() {
          fixCmsOverflow();
          if (++attempts >= 20) clearInterval(iv);
        }, 600);
      });
    }
  </script>
</body>
</html>
