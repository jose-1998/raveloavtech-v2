<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Content Manager — Ravelo AV Tech</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    /* Make the CMS fill available space above the tip bar */
    body.tip-open   { padding-bottom: var(--tip-h, 56px); }
    body.tip-closed { padding-bottom: 0; }

    /* Tip bar */
    .rav-tip {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 99999;
      background: #0c2d3a;
      border-top: 2px solid #e07070;
      color: rgba(255,255,255,0.85);
      font: 13px/1.5 sans-serif;
      padding: 8px 44px 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.25s ease;
    }
    .rav-tip.hidden {
      transform: translateY(100%);
      pointer-events: none;
    }
    .rav-tip-text { flex: 1; }
    .rav-tip strong { color: #e07070; }
    .rav-tip em { color: #82A0CC; font-style: normal; }

    /* Close button */
    .rav-tip-close {
      position: absolute;
      right: 10px; top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.1);
      border: none;
      color: #fff;
      font-size: 16px;
      line-height: 1;
      width: 28px; height: 28px;
      border-radius: 4px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .rav-tip-close:hover { background: rgba(255,255,255,0.2); }

    /* Reopen button (floats bottom-left when tip is dismissed) */
    .rav-tip-reopen {
      position: fixed;
      bottom: 10px; left: 10px;
      z-index: 99998;
      background: #0c2d3a;
      border: 1px solid #e07070;
      color: #e07070;
      font: 12px sans-serif;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      display: none;
    }
    .rav-tip-reopen.visible { display: block; }

    /* Mobile tweaks */
    @media (max-width: 600px) {
      .rav-tip { font-size: 11.5px; padding: 8px 40px 8px 12px; }
    }

    /* ── CMS mobile overrides (injected before CMS mounts) ── */
    @media (max-width: 768px) {
      /* Make every fixed toolbar/header in the CMS scrollable horizontally */
      header,
      [class*="Toolbar"],
      [class*="toolbar"],
      [class*="AppBar"],
      [class*="EditorControl"],
      [class*="ControlPane"] {
        overflow-x: auto !important;
        -webkit-overflow-scrolling: touch !important;
      }

      /* Shrink header button text & padding so more fits */
      header button,
      header a {
        font-size: 12px !important;
        padding: 6px 10px !important;
        white-space: nowrap !important;
      }

      /* Prevent the whole app from clipping overflow */
      #root, #nc-root, [id^="cms-"] {
        overflow-x: auto !important;
      }
    }
  </style>
</head>
<body class="tip-open">

  <div class="rav-tip" id="ravTip">
    <span class="rav-tip-text">
      ⚠️ <strong>Para cambiar una foto:</strong>
      usa 🗑 <em>eliminar</em> en esa entrada y agrega una <em>nueva</em> —
      <strong>NO uses "Choose an image" en entradas existentes.</strong>
    </span>
    <button class="rav-tip-close" id="ravClose" aria-label="Cerrar aviso">✕</button>
  </div>

  <button class="rav-tip-reopen" id="ravReopen">⚠️ Ver aviso</button>

  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    (function () {
      var tip     = document.getElementById('ravTip');
      var closeBtn = document.getElementById('ravClose');
      var reopen  = document.getElementById('ravReopen');
      var body    = document.body;

      // Measure tip height and expose as CSS var
      function setTipHeight() {
        var h = tip.offsetHeight;
        document.documentElement.style.setProperty('--tip-h', h + 'px');
      }
      setTipHeight();
      window.addEventListener('resize', setTipHeight);

      // Restore dismissed state
      if (sessionStorage.getItem('ravTipDismissed')) {
        tip.classList.add('hidden');
        reopen.classList.add('visible');
        body.classList.replace('tip-open', 'tip-closed');
      }

      closeBtn.addEventListener('click', function () {
        tip.classList.add('hidden');
        reopen.classList.add('visible');
        body.classList.replace('tip-open', 'tip-closed');
        sessionStorage.setItem('ravTipDismissed', '1');
      });

      reopen.addEventListener('click', function () {
        tip.classList.remove('hidden');
        reopen.classList.remove('visible');
        body.classList.replace('tip-closed', 'tip-open');
        sessionStorage.removeItem('ravTipDismissed');
        setTipHeight();
      });
    })();

    // Force mobile scrollable toolbar — runs every 600ms for 20s
    // (CMS uses inline styles we can't override with CSS alone)
    if (window.innerWidth <= 900) {
      function fixCmsOverflow() {
        // Walk up from every header/nav and un-clip any overflow:hidden ancestor
        document.querySelectorAll('header, nav, [role="toolbar"]').forEach(function(el) {
          el.style.overflowX = 'auto';
          el.style.webkitOverflowScrolling = 'touch';
          var node = el;
          for (var i = 0; i < 8; i++) {
            node = node.parentElement;
            if (!node || node === document.documentElement) break;
            var cs = window.getComputedStyle(node);
            if (cs.overflow === 'hidden' || cs.overflowX === 'hidden') {
              node.style.overflowX = 'auto';
            }
          }
        });
        // Also catch any div that is acting as a toolbar (has multiple buttons as direct children)
        document.querySelectorAll('div').forEach(function(div) {
          var btns = div.querySelectorAll(':scope > button, :scope > a');
          if (btns.length >= 2) {
            div.style.overflowX = 'auto';
            div.style.webkitOverflowScrolling = 'touch';
            div.style.flexShrink = '0';
          }
        });
      }

      var attempts = 0;
      var iv = setInterval(function() {
        fixCmsOverflow();
        if (++attempts >= 34) clearInterval(iv); // ~20 seconds
      }, 600);

      // Also re-run on every navigation inside the CMS
      window.addEventListener('hashchange', function() {
        attempts = 0;
        clearInterval(iv);
        iv = setInterval(function() {
          fixCmsOverflow();
          if (++attempts >= 20) clearInterval(iv);
        }, 600);
      });
    }
  </script>
</body>
</html>
