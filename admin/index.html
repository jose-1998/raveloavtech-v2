<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager — Ravelo AV Tech</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    .rav-tip {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 99999;
      background: #0c2d3a;
      border-top: 2px solid #e07070;
      color: rgba(255,255,255,0.85);
      font: 13px/1.6 sans-serif;
      padding: 10px 24px;
      text-align: center;
    }
    .rav-tip strong { color: #e07070; }
    .rav-tip em { color: #82A0CC; font-style: normal; }
  </style>
</head>
<body>
  <div class="rav-tip">
    ⚠️ <strong>Para cambiar una foto existente:</strong>
    usa el ícono <em>🗑 eliminar</em> en esa entrada
    y luego agrega una <em>nueva entrada</em> al final —
    <strong>NO uses "Choose an image" en entradas que ya tienen foto.</strong>
  </div>

  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
