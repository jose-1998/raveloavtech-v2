<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Content Manager — Ravelo AV Tech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,600;0,700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="/uploads/favicon.png" />
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:       #0c2d3a;
      --navy-dark:  #0d1b2a;
      --navy-mid:   #0a2030;
      --blue:       #82A0CC;
      --blue-btn:   #5b8dee;
      --red:        #e07070;
      --text:       rgba(255,255,255,0.85);
      --text-dim:   rgba(255,255,255,0.45);
      --border:     rgba(130,160,204,0.13);
    }

    html, body {
      height: 100%;
      background: var(--navy-dark);
      font-family: 'Figtree', -apple-system, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Top bar ── */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 900;
      height: 58px;
      background: var(--navy);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
    }
    .topbar-logo img { height: 34px; width: auto; display: block; }
    .topbar-divider  { width: 1px; height: 20px; background: rgba(130,160,204,0.2); flex-shrink: 0; }
    .topbar-label    { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--blue); }
    .topbar-badge    {
      margin-left: auto;
      background: rgba(130,160,204,0.1);
      border: 1px solid var(--border);
      color: var(--blue);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 3px;
    }
    .topbar-publish {
      background: rgba(91,141,238,0.12);
      border: 1px solid rgba(91,141,238,0.25);
      color: rgba(91,141,238,0.4);
      font-size: 11px;
      font-weight: 600;
      font-family: inherit;
      padding: 5px 12px;
      border-radius: 5px;
      cursor: default;
      white-space: nowrap;
      transition: background 0.2s, color 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .topbar-publish.dirty {
      background: var(--blue-btn);
      border-color: var(--blue-btn);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 0 0 0 rgba(91,141,238,0.5);
      animation: pulse-pub 1.8s ease-in-out infinite;
    }
    .topbar-publish.dirty:active { background: #4a7de0; }
    @keyframes pulse-pub {
      0%, 100% { box-shadow: 0 0 0 0 rgba(91,141,238,0.45); }
      50%       { box-shadow: 0 0 0 6px rgba(91,141,238,0); }
    }

    .topbar-logout {
      background: none;
      border: 1px solid rgba(224,112,112,0.35);
      color: var(--red);
      font-size: 11px;
      font-family: inherit;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
      white-space: nowrap;
    }
    .topbar-logout:hover { background: rgba(224,112,112,0.1); }

    /* ── Login screen ── */
    #loginScreen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .login-card {
      background: var(--navy);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 36px 28px;
      width: 100%;
      max-width: 340px;
      text-align: center;
    }
    .login-card img { height: 40px; width: auto; margin-bottom: 24px; }
    .login-card h1 { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
    .login-card p  { font-size: 13px; color: var(--text-dim); margin-bottom: 28px; }
    .login-btn {
      width: 100%;
      padding: 13px;
      background: var(--blue-btn);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }
    .login-btn:hover { background: #4a7de0; }

    /* ── Admin screen ── */
    #adminScreen { display: none; padding: 70px 12px 80px; }

    .page-title {
      font-size: 15px;
      font-weight: 600;
      color: rgba(255,255,255,0.9);
      margin-bottom: 14px;
      padding: 0 2px;
    }

    /* ── Category folders ── */
    .folder {
      margin-bottom: 9px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .folder-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 14px;
      background: var(--navy);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: background 0.15s;
    }
    .folder-header:active { background: var(--navy-mid); }
    .folder-icon  { font-size: 18px; flex-shrink: 0; }
    .folder-name  { font-weight: 600; font-size: 14px; flex: 1; }
    .folder-count {
      background: rgba(91,141,238,0.15);
      color: var(--blue-btn);
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
      min-width: 22px;
      text-align: center;
    }
    .folder-empty { color: var(--text-dim); font-size: 11px; }
    .folder-chevron {
      color: rgba(130,160,204,0.5);
      font-size: 11px;
      transition: transform 0.2s;
      flex-shrink: 0;
    }
    .folder.open .folder-header  { background: var(--navy-mid); }
    .folder.open .folder-chevron { transform: rotate(90deg); }

    .folder-body { display: none; background: #0a1e2b; }
    .folder.open .folder-body { display: block; }

    /* ── Photo grid ── */
    .photo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 10px 10px 6px;
    }
    .photo-card {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 4/3;
      background: var(--navy);
    }
    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .photo-delete {
      position: absolute;
      top: 5px; right: 5px;
      z-index: 3;
      width: 28px; height: 28px;
      background: rgba(224,112,112,0.88);
      border: none;
      border-radius: 50%;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .photo-delete:active { background: #e07070; }

    .photo-move {
      position: absolute;
      top: 5px; left: 5px;
      z-index: 3;
      width: 28px; height: 28px;
      background: rgba(13,27,42,0.75);
      border: 1px solid rgba(130,160,204,0.35);
      border-radius: 50%;
      color: var(--blue);
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      backdrop-filter: blur(4px);
    }
    .photo-move:active { background: rgba(91,141,238,0.3); }

    /* ── Category sheet ── */
    .cat-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 9000;
    }
    .cat-overlay.show { display: block; }
    .cat-sheet {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 9001;
      background: var(--navy);
      border-top: 1px solid var(--border);
      border-radius: 16px 16px 0 0;
      padding: 0 0 env(safe-area-inset-bottom, 12px);
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(.32,.72,0,1);
    }
    .cat-sheet.show { transform: translateY(0); }
    .cat-sheet-handle {
      width: 36px; height: 4px;
      background: rgba(130,160,204,0.25);
      border-radius: 2px;
      margin: 10px auto 14px;
    }
    .cat-sheet-title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
      padding: 0 16px 10px;
    }
    .cat-option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 16px;
      cursor: pointer;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      border-top: 1px solid var(--border);
      transition: background 0.12s;
    }
    .cat-option:active { background: rgba(130,160,204,0.08); }
    .cat-option-icon  { font-size: 18px; flex-shrink: 0; }
    .cat-option-check { margin-left: auto; color: var(--blue-btn); font-size: 16px; }

    /* ── Add photo button ── */
    .add-row { padding: 7px 10px 12px; }
    .add-btn {
      width: 100%;
      padding: 11px;
      border-radius: 8px;
      background: rgba(91,141,238,0.08);
      border: 1.5px dashed rgba(91,141,238,0.35);
      color: var(--blue-btn);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .add-btn:hover  { background: rgba(91,141,238,0.14); border-color: rgba(91,141,238,0.55); }
    .add-btn:active { background: rgba(91,141,238,0.2); }
    .add-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Warning tip bar ── */
    .tip-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 900;
      background: linear-gradient(90deg, #1a0c0c 0%, #2a1010 100%);
      border-top: 2px solid var(--red);
      padding: 9px 44px 9px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      line-height: 1.45;
      transition: transform 0.3s ease;
    }
    .tip-bar.hidden { transform: translateY(100%); pointer-events: none; }
    .tip-bar strong { color: var(--red); }
    .tip-bar em     { color: var(--blue); font-style: normal; font-weight: 600; }
    .tip-close {
      position: absolute;
      right: 8px; top: 50%;
      transform: translateY(-50%);
      width: 28px; height: 28px;
      background: rgba(224,112,112,0.15);
      border: 1px solid rgba(224,112,112,0.3);
      color: var(--red);
      font-size: 13px;
      border-radius: 6px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── Toast ── */
    #toast {
      position: fixed;
      top: 70px; left: 50%;
      transform: translateX(-50%) translateY(-12px);
      z-index: 9999;
      background: #0c2d3a;
      border: 1px solid rgba(130,160,204,0.25);
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    #toast.ok  { color: #6ee7b7; border-color: rgba(110,231,183,0.3); }
    #toast.err { color: var(--red); border-color: rgba(224,112,112,0.3); }

    /* ── Loading overlay ── */
    #loadingOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(13,27,42,0.75);
      z-index: 8000;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      font-size: 14px;
      color: var(--blue);
    }
    #loadingOverlay.show { display: flex; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(130,160,204,0.2);
      border-top-color: var(--blue-btn);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 480px) {
      .topbar-label  { display: none; }
      .topbar-divider { display: none; }
    }

    /* ── Tab bar ── */
    .tab-bar {
      display: flex;
      gap: 4px;
      margin-bottom: 14px;
      background: rgba(130,160,204,0.07);
      border-radius: 8px;
      padding: 4px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 6px;
      background: none;
      color: var(--text-dim);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .tab-btn.active {
      background: var(--navy);
      color: var(--text);
    }

    /* ── Ticket cards ── */
    .ticket-card {
      background: var(--navy);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 9px;
    }
    .ticket-header {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }
    .ticket-name {
      font-weight: 700;
      font-size: 14px;
      flex: 1;
    }
    .ticket-service {
      background: rgba(91,141,238,0.15);
      color: var(--blue-btn);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 20px;
      white-space: nowrap;
    }
    .ticket-date {
      font-size: 10px;
      color: var(--text-dim);
      margin-bottom: 8px;
    }
    .ticket-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 5px;
    }
    .ticket-row a { color: var(--blue); text-decoration: none; }
    .ticket-row a:hover { text-decoration: underline; }
    .ticket-row strong { color: var(--text); font-weight: 400; }
    .ticket-msg {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-dim);
      line-height: 1.55;
    }
    .tickets-empty {
      text-align: center;
      color: var(--text-dim);
      font-size: 14px;
      padding: 40px 0;
    }
    .tickets-count {
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 12px;
      padding: 0 2px;
    }
    .ticket-review-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      padding: 8px 14px;
      background: rgba(52,199,89,0.12);
      color: #4cd964;
      border: 1px solid rgba(52,199,89,0.3);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, opacity 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .ticket-review-btn:hover, .ticket-review-btn:active {
      background: rgba(52,199,89,0.22);
      border-color: rgba(52,199,89,0.5);
    }
    .ticket-review-btn:disabled {
      opacity: 0.5;
      cursor: default;
    }
    .ticket-review-btn.sent {
      background: rgba(52,199,89,0.25);
      border-color: rgba(52,199,89,0.6);
      color: #4cd964;
    }
  </style>
</head>
<body>

<!-- Login screen -->
<div id="loginScreen">
  <div class="login-card">
    <img src="/uploads/logo.png" alt="Ravelo AV Tech" />
    <h1>Content Manager</h1>
    <p>Sign in to manage your site photos.</p>
    <button class="login-btn" id="loginBtn">Iniciar sesión</button>
  </div>
</div>

<!-- Admin screen -->
<div id="adminScreen">

  <!-- Top bar -->
  <div class="topbar">
    <a class="topbar-logo" href="/" target="_blank">
      <img src="/uploads/logo.png" alt="Ravelo AV Tech" width="110" height="34" />
    </a>
    <div class="topbar-divider"></div>
    <span class="topbar-label">Content Manager</span>
    <div class="topbar-badge">Admin</div>
    <button class="topbar-publish" id="publishBtn" disabled>Publicar</button>
    <button class="topbar-logout" id="logoutBtn">Salir</button>
  </div>

  <!-- Tab bar -->
  <div class="tab-bar">
    <button class="tab-btn active" id="tabGallery">🖼 Galería</button>
    <button class="tab-btn" id="tabTickets">🎫 Tickets</button>
  </div>

  <!-- Gallery view -->
  <div id="viewGallery">
    <p class="page-title">Our Work — Gallery</p>
    <div id="foldersContainer"></div>
  </div>

  <!-- Tickets view -->
  <div id="viewTickets" style="display:none;">
    <p class="page-title">Quote Requests</p>
    <div id="ticketsCount" class="tickets-count"></div>
    <div id="ticketsContainer"></div>
  </div>

</div>

<!-- Warning tip -->
<div class="tip-bar" id="tipBar">
  <span>⚠️</span>
  <span>
    <strong>✕</strong> elimina · <strong>⇄</strong> cambia categoría · <em>+ Agregar foto</em> sube una nueva imagen.
  </span>
  <button class="tip-close" id="tipClose" aria-label="Cerrar aviso">✕</button>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Loading overlay -->
<div id="loadingOverlay">
  <div class="spinner"></div>
  <span id="loadingMsg">Guardando…</span>
</div>

<!-- Category picker sheet -->
<div class="cat-overlay" id="catOverlay"></div>
<div class="cat-sheet" id="catSheet">
  <div class="cat-sheet-handle"></div>
  <div class="cat-sheet-title">Mover a categoría</div>
  <div id="catOptions"></div>
</div>

<!-- Hidden file input -->
<input type="file" id="fileInput" accept="image/*" multiple style="display:none;" />

<script>
(function () {
  'use strict';

  const GIT_API = '/.netlify/git/github';

  const CATEGORIES = [
    { key: 'av',         label: 'Home Theater', icon: '🎬' },
    { key: 'security',   label: 'Security',      icon: '📷' },
    { key: 'network',    label: 'Networks',      icon: '🌐' },
    { key: 'smart',      label: 'Smart Home',    icon: '🏠' },
    { key: 'wiring',     label: 'Wiring',        icon: '🔌' },
    { key: 'lowvoltage', label: 'Low Voltage',   icon: '⚡' },
    { key: 'lutron',     label: 'Lutron',        icon: '💡' },
  ];

  var gallery = [];          // [{ url, category }]
  var pendingCategory = null;
  var pendingMove = null;    // { url, fromCat }
  var isDirty = false;
  var blobCache = {};        // url → local blob data URL (while Netlify deploys)

  // ── Elements ──────────────────────────────────────────────────────────────
  var loginScreen   = document.getElementById('loginScreen');
  var adminScreen   = document.getElementById('adminScreen');
  var loginBtn      = document.getElementById('loginBtn');
  var logoutBtn     = document.getElementById('logoutBtn');
  var foldersEl     = document.getElementById('foldersContainer');
  var fileInput     = document.getElementById('fileInput');
  var toastEl       = document.getElementById('toast');
  var loadingEl     = document.getElementById('loadingOverlay');
  var loadingMsgEl  = document.getElementById('loadingMsg');
  var tipBar        = document.getElementById('tipBar');
  var tipClose      = document.getElementById('tipClose');
  var catOverlay    = document.getElementById('catOverlay');
  var catSheet      = document.getElementById('catSheet');
  var catOptionsEl  = document.getElementById('catOptions');
  var publishBtn    = document.getElementById('publishBtn');

  // ── Tip bar ───────────────────────────────────────────────────────────────
  if (sessionStorage.getItem('tipDismissed')) tipBar.classList.add('hidden');
  tipClose.addEventListener('click', function () {
    tipBar.classList.add('hidden');
    sessionStorage.setItem('tipDismissed', '1');
  });

  // ── Dirty state / Publish ─────────────────────────────────────────────────
  function markDirty() {
    isDirty = true;
    publishBtn.classList.add('dirty');
    publishBtn.disabled = false;
  }
  function markClean() {
    isDirty = false;
    publishBtn.classList.remove('dirty');
    publishBtn.disabled = true;
  }

  publishBtn.addEventListener('click', function () {
    if (!isDirty) return;
    saveGallery().then(function () {
      markClean();
    }).catch(function () {});
  });

  // ── Toast ─────────────────────────────────────────────────────────────────
  var toastTimer;
  function showToast(msg, type) {
    clearTimeout(toastTimer);
    toastEl.textContent = msg;
    toastEl.className = 'show ' + (type || 'ok');
    toastTimer = setTimeout(function () { toastEl.className = ''; }, 3000);
  }

  // ── Loading ───────────────────────────────────────────────────────────────
  function setLoading(msg) {
    if (msg) {
      loadingMsgEl.textContent = msg;
      loadingEl.classList.add('show');
    } else {
      loadingEl.classList.remove('show');
    }
  }

  // ── Auth ──────────────────────────────────────────────────────────────────
  function getToken() {
    var user = netlifyIdentity.currentUser();
    if (!user) return Promise.reject(new Error('Not logged in'));
    return user.jwt();
  }

  function showLogin()  { loginScreen.style.display = 'flex'; adminScreen.style.display = 'none'; }
  function showAdmin()  { loginScreen.style.display = 'none'; adminScreen.style.display = 'block'; }

  loginBtn.addEventListener('click', function () { netlifyIdentity.open(); });
  logoutBtn.addEventListener('click', function () { netlifyIdentity.logout(); });

  netlifyIdentity.on('login', function () {
    netlifyIdentity.close();
    showAdmin();
    loadGallery();
  });
  netlifyIdentity.on('logout', function () { showLogin(); });
  netlifyIdentity.on('init', function (user) {
    if (user) { showAdmin(); loadGallery(); }
    else showLogin();
  });

  // ── Git Gateway API ───────────────────────────────────────────────────────
  function gitGet(path) {
    return getToken().then(function (token) {
      return fetch(GIT_API + path, {
        headers: { 'Authorization': 'Bearer ' + token }
      }).then(function (r) {
        if (!r.ok) throw new Error('GET ' + path + ' failed: ' + r.status);
        return r.json();
      });
    });
  }

  function gitPut(path, body) {
    return getToken().then(function (token) {
      return fetch(GIT_API + path, {
        method: 'PUT',
        headers: {
          'Authorization': 'Bearer ' + token,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
      }).then(function (r) {
        if (!r.ok) return r.text().then(function (t) { throw new Error(t); });
        return r.json();
      });
    });
  }

  // ── Load gallery ──────────────────────────────────────────────────────────
  function loadGallery() {
    setLoading('Cargando galería…');
    gitGet('/contents/images.json').then(function (data) {
      var content = JSON.parse(decodeURIComponent(
        escape(atob(data.content.replace(/\n/g, '')))
      ));
      gallery = content.gallery || [];
      setLoading(null);
      renderFolders();
    }).catch(function (err) {
      setLoading(null);
      showToast('Error cargando galería', 'err');
      console.error(err);
    });
  }

  // ── Save gallery ──────────────────────────────────────────────────────────
  var CAT_LABELS = {
    av: 'Home Theater', network: 'Networks', security: 'Security',
    smart: 'Smart Home', wiring: 'Wiring', lowvoltage: 'Low Voltage', lutron: 'Lutron'
  };

  function saveGallery() {
    setLoading('Guardando…');

    // Step 1 — Save images.json (critical)
    return gitGet('/contents/images.json').then(function (data) {
      var encoded = btoa(unescape(encodeURIComponent(
        JSON.stringify({ gallery: gallery }, null, 2)
      )));
      return gitPut('/contents/images.json', {
        message: 'Update gallery photos',
        content: encoded,
        sha: data.sha
      });

    // Step 2 — Sync hardcoded fallback in index.html (non-fatal)
    }).then(function () {
      return gitGet('/contents/index.html').then(function (data) {
        // Robust UTF-8 decode
        var raw  = atob(data.content.replace(/\n/g, ''));
        var html = decodeURIComponent(
          raw.split('').map(function (c) {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
          }).join('')
        );

        var newItems = gallery.map(function (item) {
          var label = CAT_LABELS[item.category] || item.category;
          // Escape $ to avoid replacement string special chars
          return ('    <div class="gal-item" data-category="' + item.category + '">' +
            '<img loading="lazy" decoding="async" src="' + item.url + '" alt="' + label + '" />' +
            '<div class="gal-overlay"><span>' + label + '</span></div>' +
            '</div>').replace(/\$/g, '$$$$');
        }).join('\n');

        var updated = html.replace(
          /(<div id="gallery-container">)([\s\S]*?)(<\/div>)(\s*\n\s*<!-- Gallery grid -->)/,
          '$1\n' + newItems + '\n  $3$4'
        );

        if (updated === html) return; // regex didn't match, skip

        var encoded = btoa(unescape(encodeURIComponent(updated)));
        return gitPut('/contents/index.html', {
          message: 'Sync gallery fallback with images.json',
          content: encoded,
          sha: data.sha
        });
      }).catch(function (err) {
        // index.html update failing is not critical — images.json is already saved
        console.warn('index.html sync failed (non-fatal):', err);
      });

    }).then(function () {
      setLoading(null);
      showToast('✓ Publicado — el sitio se está actualizando', 'ok');
    }).catch(function (err) {
      setLoading(null);
      showToast('Error al publicar', 'err');
      console.error(err);
      throw err;
    });
  }

  // ── Upload image ──────────────────────────────────────────────────────────
  function resizeImage(file, maxW) {
    maxW = maxW || 1400;
    return new Promise(function (resolve) {
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function () {
        URL.revokeObjectURL(url);
        var ratio = Math.min(1, maxW / img.width);
        var w = Math.round(img.width * ratio);
        var h = Math.round(img.height * ratio);
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(function (blob) {
          if (!blob) { reject(new Error('No se pudo convertir la imagen')); return; }
          resolve(blob);
        }, 'image/jpeg', 0.85);
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error('No se pudo leer la imagen'));
      };
      img.src = url;
    });
  }

  function uploadImage(file, category) {
    return resizeImage(file).then(function (blob) {
      return new Promise(function (resolve, reject) {
        var reader = new FileReader();
        reader.onload = function () {
          var dataUrl = reader.result;
          var b64 = dataUrl.split(',')[1];
          var ts  = Date.now();
          var filename = 'gallery-' + category + '-' + ts + '.jpg';
          var finalUrl = '/uploads/' + filename;
          gitPut('/contents/uploads/' + filename, {
            message: 'Add gallery photo: ' + filename,
            content: b64
          }).then(function () {
            // Cache blob locally so the admin shows it before Netlify redeploys
            blobCache[finalUrl] = dataUrl;
            resolve(finalUrl);
          }).catch(reject);
        };
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    });
  }

  // ── File input handler ────────────────────────────────────────────────────
  fileInput.addEventListener('change', function () {
    var files = Array.from(fileInput.files);
    fileInput.value = '';
    if (!files.length || !pendingCategory) return;

    var cat = pendingCategory;
    pendingCategory = null;

    // Validate all files first
    for (var i = 0; i < files.length; i++) {
      if (!files[i].type.startsWith('image/')) {
        showToast('"' + files[i].name + '" no es una imagen válida', 'err');
        return;
      }
      if (files[i].size > 30 * 1024 * 1024) {
        showToast('"' + files[i].name + '" es demasiado grande (máx 30 MB)', 'err');
        return;
      }
    }

    var total = files.length;
    var done = 0;
    var failed = 0;

    function uploadNext(idx) {
      if (idx >= total) {
        setLoading(null);
        renderFolders();
        markDirty();
        var msg = (total - failed) + ' foto' + (total - failed !== 1 ? 's' : '') + ' agregada' + (total - failed !== 1 ? 's' : '');
        if (failed > 0) msg += ' (' + failed + ' fallaron)';
        showToast('✓ ' + msg + ' — toca Publicar para guardar', failed ? 'err' : 'ok');
        return;
      }
      setLoading('Subiendo ' + (idx + 1) + ' de ' + total + '…');
      uploadImage(files[idx], cat).then(function (url) {
        gallery.push({ url: url, category: cat });
        done++;
        uploadNext(idx + 1);
      }).catch(function (err) {
        failed++;
        console.error(err);
        uploadNext(idx + 1);
      });
    }

    uploadNext(0);
  });

  // ── Category sheet ────────────────────────────────────────────────────────
  function openCatSheet(url, fromCat) {
    pendingMove = { url: url, fromCat: fromCat };

    catOptionsEl.innerHTML = '';
    CATEGORIES.forEach(function (cat) {
      var btn = document.createElement('button');
      btn.className = 'cat-option';
      btn.innerHTML =
        '<span class="cat-option-icon">' + cat.icon + '</span>' +
        '<span>' + cat.label + '</span>' +
        (cat.key === fromCat ? '<span class="cat-option-check">✓</span>' : '');
      btn.addEventListener('click', function () {
        closeCatSheet();
        if (cat.key !== fromCat) movePhoto(url, fromCat, cat.key);
      });
      catOptionsEl.appendChild(btn);
    });

    catOverlay.classList.add('show');
    // next frame so transition plays
    requestAnimationFrame(function () { catSheet.classList.add('show'); });
  }

  function closeCatSheet() {
    catSheet.classList.remove('show');
    catOverlay.classList.remove('show');
    pendingMove = null;
  }

  catOverlay.addEventListener('click', closeCatSheet);

  function movePhoto(url, fromCat, toCat) {
    gallery = gallery.map(function (p) {
      if (p.url === url && p.category === fromCat) {
        return { url: p.url, category: toCat };
      }
      return p;
    });
    openFolders[toCat] = true;
    renderFolders();
    markDirty();
  }

  // ── Delete photo ──────────────────────────────────────────────────────────
  function deletePhoto(url, category) {
    if (!confirm('¿Eliminar esta foto?')) return;
    gallery = gallery.filter(function (p) {
      return !(p.url === url && p.category === category);
    });
    renderFolders();
    markDirty();
  }

  // ── Render folders ────────────────────────────────────────────────────────
  var openFolders = {};

  function renderFolders() {
    // Remember which folders are open
    foldersEl.querySelectorAll('.folder.open').forEach(function (el) {
      openFolders[el.dataset.cat] = true;
    });

    foldersEl.innerHTML = '';

    CATEGORIES.forEach(function (cat) {
      var photos = gallery.filter(function (p) { return p.category === cat.key; });
      var count  = photos.length;
      var isOpen = openFolders[cat.key] !== undefined
        ? openFolders[cat.key]
        : false;

      var folder = document.createElement('div');
      folder.className = 'folder' + (isOpen ? ' open' : '');
      folder.dataset.cat = cat.key;

      // Header
      var header = document.createElement('div');
      header.className = 'folder-header';
      header.innerHTML =
        '<span class="folder-icon">' + cat.icon + '</span>' +
        '<span class="folder-name">' + cat.label + '</span>' +
        (count > 0
          ? '<span class="folder-count">' + count + '</span>'
          : '<span class="folder-empty">vacío</span>') +
        '<span class="folder-chevron">▶</span>';
      header.addEventListener('click', function () {
        var wasOpen = folder.classList.contains('open');
        folder.classList.toggle('open');
        openFolders[cat.key] = !wasOpen;
      });
      folder.appendChild(header);

      // Body
      var body = document.createElement('div');
      body.className = 'folder-body';

      // Photo grid
      if (count > 0) {
        var grid = document.createElement('div');
        grid.className = 'photo-grid';
        photos.forEach(function (photo) {
          var card = document.createElement('div');
          card.className = 'photo-card';

          var img = document.createElement('img');
          img.src = blobCache[photo.url] || photo.url;
          img.alt = cat.label;
          img.loading = 'lazy';
          img.onerror = function () {
            img.style.display = 'none';
            var ph = document.createElement('div');
            ph.style.cssText = 'position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:rgba(224,112,112,0.7);font-size:11px;text-align:center;padding:8px;pointer-events:none;';
            ph.innerHTML = '<span style="font-size:22px;">⚠️</span><span>Imagen no encontrada</span>';
            card.appendChild(ph);
          };
          card.appendChild(img);

          var move = document.createElement('button');
          move.className = 'photo-move';
          move.textContent = '⇄';
          move.setAttribute('aria-label', 'Cambiar categoría');
          move.addEventListener('click', function (e) {
            e.stopPropagation();
            openCatSheet(photo.url, photo.category);
          });
          card.appendChild(move);

          var del = document.createElement('button');
          del.className = 'photo-delete';
          del.textContent = '✕';
          del.setAttribute('aria-label', 'Eliminar foto');
          del.addEventListener('click', function (e) {
            e.stopPropagation();
            deletePhoto(photo.url, photo.category);
          });
          card.appendChild(del);

          grid.appendChild(card);
        });
        body.appendChild(grid);
      }

      // Add button
      var addRow = document.createElement('div');
      addRow.className = 'add-row';
      var addBtn = document.createElement('button');
      addBtn.className = 'add-btn';
      addBtn.textContent = '+ Agregar foto';
      addBtn.addEventListener('click', function () {
        pendingCategory = cat.key;
        fileInput.click();
      });
      addRow.appendChild(addBtn);
      body.appendChild(addRow);

      folder.appendChild(body);
      foldersEl.appendChild(folder);
    });
  }

  // ── Tabs ──────────────────────────────────────────────────────────────────
  var tabGallery    = document.getElementById('tabGallery');
  var tabTickets    = document.getElementById('tabTickets');
  var viewGallery   = document.getElementById('viewGallery');
  var viewTickets   = document.getElementById('viewTickets');
  var ticketsEl     = document.getElementById('ticketsContainer');
  var ticketsCount  = document.getElementById('ticketsCount');
  var ticketsLoaded = false;

  tabGallery.addEventListener('click', function () {
    tabGallery.classList.add('active');
    tabTickets.classList.remove('active');
    viewGallery.style.display = 'block';
    viewTickets.style.display = 'none';
  });

  tabTickets.addEventListener('click', function () {
    tabTickets.classList.add('active');
    tabGallery.classList.remove('active');
    viewGallery.style.display = 'none';
    viewTickets.style.display = 'block';
    if (!ticketsLoaded) loadTickets();
  });

  // ── Load tickets ──────────────────────────────────────────────────────────
  function loadTickets() {
    ticketsLoaded = true;
    ticketsEl.innerHTML = '<div class="tickets-empty">Cargando tickets…</div>';

    getToken().then(function (token) {
      return fetch('/.netlify/functions/get-tickets', {
        headers: { 'Authorization': 'Bearer ' + token }
      });
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (tickets) {
      if (!tickets.length) {
        ticketsCount.textContent = '';
        ticketsEl.innerHTML = '<div class="tickets-empty">📭 No hay tickets todavía</div>';
        return;
      }
      ticketsCount.textContent = tickets.length + ' ticket' + (tickets.length !== 1 ? 's' : '') + ' recibido' + (tickets.length !== 1 ? 's' : '');
      ticketsEl.innerHTML = '';
      tickets.forEach(function (t) {
        var date = new Date(t.created_at).toLocaleString('en-US', {
          month: 'short', day: 'numeric', year: 'numeric',
          hour: 'numeric', minute: '2-digit', hour12: true
        });
        var card = document.createElement('div');
        card.className = 'ticket-card';
        card.innerHTML =
          '<div class="ticket-header">' +
            '<span class="ticket-name">' + esc(t.name || 'Unknown') + '</span>' +
            (t.service ? '<span class="ticket-service">' + esc(t.service) + '</span>' : '') +
          '</div>' +
          '<div class="ticket-date">📅 ' + date + '</div>' +
          (t.email   ? '<div class="ticket-row">✉️ <a href="mailto:' + esc(t.email) + '">' + esc(t.email) + '</a></div>' : '') +
          (t.phone   ? '<div class="ticket-row">📞 <a href="tel:' + esc(t.phone.replace(/\D/g,'')) + '">' + esc(t.phone) + '</a></div>' : '') +
          (t.address ? '<div class="ticket-row">📍 <strong>' + esc(t.address) + '</strong></div>' : '') +
          (t.message ? '<div class="ticket-msg">"' + esc(t.message) + '"</div>' : '') +
          (t.email
            ? '<button class="ticket-review-btn" onclick="sendReview(this,' +
                JSON.stringify(t.name) + ',' + JSON.stringify(t.email) +
                ')">⭐ Pedir review en Google</button>'
            : '');
        ticketsEl.appendChild(card);
      });
    }).catch(function (err) {
      ticketsLoaded = false;
      ticketsEl.innerHTML = '<div class="tickets-empty">⚠️ Error cargando tickets<br><small>' + err.message + '</small></div>';
      console.error(err);
    });
  }

  function esc(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  window.sendReview = function sendReview(btn, name, email) {
    if (btn.disabled) return;
    btn.disabled = true;
    btn.textContent = '⏳ Enviando…';
    getToken().then(function(token) {
      return fetch('/.netlify/functions/send-review', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token,
        },
        body: JSON.stringify({ name: name, email: email }),
      });
    }).then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function() {
      btn.textContent = '✓ Correo enviado';
      btn.classList.add('sent');
      showToast('✓ Review enviado a ' + email, 'ok');
    }).catch(function(err) {
      btn.disabled = false;
      btn.textContent = '⭐ Pedir review en Google';
      showToast('Error al enviar: ' + err.message, 'err');
    });
  }

})();
</script>
