backend:
  name: git-gateway
  branch: main

media_folder: uploads
public_folder: /uploads

editor:
  preview: false

collections:
  - name: site_images
    label: Site Images
    files:
      - name: images
        label: Gallery Photos
        file: images.json
        format: json
        fields:
          - name: gallery
            label: "Our Work — Gallery (home page)"
            widget: list
            fields:
              - name: url
                label: Photo
                widget: image
              - name: category
                label: Category
                widget: select
                options:
                  - label: "Home Theater"
                    value: "av"
                  - label: "Security"
                    value: "security"
                  - label: "Networks"
                    value: "network"
                  - label: "Smart Home"
                    value: "smart"
                  - label: "Wiring"
                    value: "wiring"
                  - label: "Low Voltage"
                    value: "lowvoltage"
                  - label: "Lutron"
                    value: "lutron"
                default: "av"
